name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Preparar arquivos para deploy
        run: |
          mkdir -p public
          cp frontend/index.html public/
          # Copiar outros arquivos estáticos se houver
          if [ -d "frontend/assets" ]; then cp -r frontend/assets public/; fi
          if [ -d "frontend/css" ]; then cp -r frontend/css public/; fi
          if [ -d "frontend/js" ]; then cp -r frontend/js public/; fi
      
      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
