<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatic Correction - Corrija Provas com IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        input, select, textarea, button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f0f7f7; color: #333333; }
        
        .input-style {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            border: 2px solid transparent;
            background: #e8f1f1;
            color: #333333;
        }

        .input-style::placeholder { color: #a0b4b4; }

        .btn-solid {

            padding: 14px 20px;
            background: #7aa2a1;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(122, 162, 161, 0.3);
        }
        .btn-solid:hover { background: #688f8e; transform: scale(0.98); }
        .btn-solid:disabled { background: #b0c4c4; cursor: not-allowed; transform: none; }

        .btn-secondary {
            padding: 12px 24px;
            background: #e8f1f1;
            color: #7aa2a1;
            font-weight: 700;
            border-radius: 12px;
            font-size: 13px;

        }

        .btn-danger {
            padding: 12px 24px;
            background: #fee2e2;
            color: #dc2626;
            font-weight: 700;
            border-radius: 12px;
            font-size: 13px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-danger:hover { background: #fecaca; }

        .btn-success {
            padding: 12px 24px;
            background: #d1fae5;

            font-weight: 700;
            border-radius: 12px;
            font-size: 13px;
            transition: all 0.3s;

        .btn-warning {

        .btn-info {

        .dark { background: #0f172a; color: #e2e8f0; }
        .dark .bg-white { background: #1e293b; }
        .dark .bg-gray-50 { background: #1e293b; }
        .dark .bg-gray-100 { background: #334155; }
        .dark .border-gray-100 { border-color: #334155; }
        .dark .border-gray-200 { border-color: #334155; }
        .dark .text-gray-400 { color: #94a3b8; }
        .dark .text-gray-500 { color: #94a3b8; }
        .dark .text-gray-600 { color: #cbd5e1; }
        .dark .text-gray-700 { color: #e2e8f0; }

        .sidebar {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
        }
        .sidebar-backdrop { flex: 1; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
        .sidebar-content {
            width: 320px;
            height: 100%;

            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;

        .dark .sidebar-content { background: #1e293b; border-color: #334155; }
        @keyframes slideRight {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes scanMove { 0% { top: 20%; } 50% { top: 80%; } 100% { top: 20%; } }

        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        .animate-bounce { animation: bounce 1s infinite; }

            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50;

        .dashboard-item i { font-size: 36px; margin-bottom: 12px; }
        .dashboard-item span { font-size: 11px; font-weight: 700; white-space: pre-line; line-height: 1.4; }

        .tab-button {

        .tab-button.active { background: #7aa2a1; color: white; }
        .tab-button:hover:not(.active) { background: #e8f1f1; }
        .dark .tab-button { color: #94a3b8; }
        .dark .tab-button:hover:not(.active) { background: #334155; }

        .status-badge.bom { background: #dbeafe; color: #2563eb; }
        .status-badge.regular { background: #fef3c7; color: #d97706; }
        .status-badge.ruim { background: #fee2e2; color: #dc2626; }
        .dark .status-badge.otimo { background: #064e3b; color: #6ee7b7; }
        .dark .status-badge.bom { background: #1e3a5f; color: #93c5fd; }

        .presenca-badge.media { background: #fef3c7; color: #d97706; }
        .presenca-badge.baixa { background: #fee2e2; color: #dc2626; }
        .dark .presenca-badge.alta { background: #064e3b; color: #6ee7b7; }
        .dark .presenca-badge.media { background: #451a03; color: #fcd34d; }
        .dark .presenca-badge.baixa { background: #450a0a; color: #fca5a5; }

        .empty-state i { font-size: 48px; color: #d1d5db; display: block; margin-bottom: 16px; }
        .empty-state h3 { font-size: 16px; font-weight: 700; color: #374151; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; }

        .progress-bar-container {
            width: 100%; height: 8px; background: #e5e7eb; border-radius: 9999px;
            overflow: hidden; position: relative;
        }
        .dark .progress-bar-container { background: #334155; }
        .progress-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.8s ease; }
        .progress-bar-fill.otimo { background: #22c55e; }
        .progress-bar-fill.bom { background: #3b82f6; }
        .progress-bar-fill.regular { background: #eab308; }
        .progress-bar-fill.ruim { background: #ef4444; }

        .question-item {

            justify-content: center; font-size: 12px; font-weight: 700; transition: all 0.2s;

        .question-item.correct { background: #d1fae5; color: #059669; border: 2px solid #6ee7b7; }
        .question-item.wrong { background: #fee2e2; color: #dc2626; border: 2px solid #fca5a5; }

        .heatmap-grid {

            aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;

        .dark .heatmap-item.high { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
        .dark .heatmap-item.medium { background: #451a03; color: #fcd34d; border-color: #78350f; }
        .dark .heatmap-item.low { background: #064e3b; color: #6ee7b7; border-color: #065f46; }

        .step-indicator {
            position: relative; display: flex; justify-content: space-between;
            align-items: center; width: 100%; padding: 0 20px;
        }
        .step-indicator .step {
            display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1;
        }

        .step-indicator .step .label.inactive { color: #9ca3af; }
        .step-indicator .progress-bar {

        }
        .step-indicator .progress-bar .fill { height: 100%; background: #7aa2a1; transition: width 0.5s; }

        .toggle-switch {

        .toggle-switch.inactive { background: #d1d5db; }

        input[type="number"] { appearance: textfield; -moz-appearance: textfield; }

            background: rgba(122,162,161,0.6); animation: scanMove 2s ease-in-out infinite;
        }

        .student-card {

        .dark .student-card { background: #1e293b; border-color: #334155; }

        #statusServidor {

            z-index: 9999; font-family: 'Inter', sans-serif;
        }
        .status-online { color: #22c55e; }
        .status-offline { color: #ef4444; }

        .drop-zone {
            border: 3px dashed #d1d5db;

            transition: all 0.3s;
            cursor: pointer;

            border-color: #7aa2a1;

        @media (max-width: 640px) {
            .sidebar-content { width: 280px; }
            .dashboard-item { padding: 16px; }

    </style>

    <div id="app"></div>

    <!-- ============================================================
    BLOCO 1: CONFIGURAÇÃO
    ============================================================ -->
    <script>
        const DOMAIN_CONFIG = {
            development: 'http://localhost:3000',
            production: 'https://automatic-correction.com'
        };

        const isProduction = window.location.hostname !== 'localhost' && 
                            window.location.hostname !== '127.0.0.1' &&
                            window.location.hostname !== '';

        const SITE_URL = isProduction ? DOMAIN_CONFIG.production : DOMAIN_CONFIG.development;
        const API_URL = `${SITE_URL}/api`;

        const CONFIG = {
            SITE_URL: SITE_URL,
            API_URL: API_URL,
            APP_NAME: 'Automatic Correction',
            APP_DOMAIN: 'automatic-correction.com',
            GITHUB_URL: 'https://github.com/capic2024118isinf0082-arch/Automatic-Correction--A.C.-',
            VERSION: '1.0.0',
            NOTA_MINIMA_APROVACAO: 6.0,
            isProduction: isProduction
        };

        console.log('🌐 AUTOMATIC CORRECTION');
        console.log(`📡 Site: ${CONFIG.SITE_URL}`);
        console.log(`🔗 API: ${CONFIG.API_URL}`);
        console.log(`📦 Ambiente: ${isProduction ? '🚀 Produção' : '💻 Desenvolvimento'}`);
    </script>

    <!-- ============================================================
    BLOCO 2: VERIFICAÇÃO DO SERVIDOR
    ============================================================ -->
    <script>
        async function verificarServidor() {
            const el = document.getElementById('statusServidor');
            if (!el) return;
            
            try {
                const response = await fetch(`${CONFIG.API_URL}/health`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: AbortSignal.timeout(5000)
                });
                
                if (response.ok) {
                    el.innerHTML = '🟢 Servidor Online';
                    el.className = 'status-online';
                    return true;
                } else {
                    el.innerHTML = '🟡 Servidor com problema';
                    el.className = 'status-offline';
                    return false;
                }
            } catch (error) {
                el.innerHTML = '🔴 Servidor Offline';
                el.className = 'status-offline';
                console.warn('⚠️ Servidor não acessível:', error.message);
                return false;
            }
        }

        if (!document.getElementById('statusServidor')) {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'statusServidor';
            statusDiv.innerHTML = '🔄 Verificando...';
            statusDiv.className = 'status-checking';
            document.body.appendChild(statusDiv);
        }

        setInterval(verificarServidor, 10000);
        setTimeout(verificarServidor, 500);
    </script>

    <!-- ============================================================
    BLOCO 3: API
    ============================================================ -->
    <script>
        window.API_URL = CONFIG.API_URL;

        function getToken() { return localStorage.getItem('token'); }

        function getHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        // ============================================================
        // AUTENTICAÇÃO
        // ============================================================
        async function apiLogin(email, senha) {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao fazer login');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no login:', error); throw error; }
        }

        async function apiRegister(dados) {
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: dados.nome,
                        sobrenome: dados.sobrenome,
                        email: dados.email,
                        senha: dados.senha,
                        biografia: dados.biografia || 'Docente',
                        escola: dados.escola || 'Escola'
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao registrar');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no registro:', error); throw error; }
        }

        async function apiGetProfile() {
            const response = await fetch(`${API_URL}/auth/profile`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar perfil');
            return data.user;
        }

        async function apiUpdateProfile(dados) {
            const response = await fetch(`${API_URL}/auth/profile`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar perfil');
            localStorage.setItem('user', JSON.stringify(data.user));
            return data.user;
        }

        // ============================================================
        // TURMAS
        // ============================================================
        async function apiListarTurmas(filtros = {}) {
            try {
                let url = `${API_URL}/turmas`;
                const params = new URLSearchParams();
                if (filtros.busca) params.append('busca', filtros.busca);
                if (filtros.status && filtros.status !== 'todos') params.append('status', filtros.status);
                if (filtros.nivel && filtros.nivel !== 'todos') params.append('nivel', filtros.nivel);
                if (filtros.ordenar) params.append('ordenar', filtros.ordenar);
                if (params.toString()) url += `?${params.toString()}`;
                
                const response = await fetch(url, { headers: getHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao listar turmas');
                return data;
            } catch (error) { console.error('❌ Erro ao listar turmas:', error); throw error; }
        }

        async function apiCriarTurma(dados) {
            try {
                const response = await fetch(`${API_URL}/turmas`, {
                    method: 'POST',

        // ============================================================

        // ============================================================
        function processarArquivoImagem(file, callback) {
            if (!file) return;
            
            const tiposValidos = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
            if (!tiposValidos.includes(file.type) && !file.type.startsWith('image/')) {
                alert('Formato de arquivo não suportado. Use JPG, PNG, GIF, WEBP ou PDF.');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('Arquivo muito grande. Máximo 10MB.');
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function() {
                callback({
                    dataUrl: reader.result,
                    mimeType: file.type,
                    base64: reader.result.split(',')[1],
                    name: file.name,
                    size: file.size
                });
            };
            reader.onerror = function() {
                alert('Erro ao ler o arquivo. Tente novamente.');
            };
            reader.readAsDataURL(file);
        }

        function tirarFoto(callback) {
            if ('mediaDevices' in navigator && navigator.mediaDevices.getUserMedia) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.onchange = function(e) {
                    if (e.target.files && e.target.files[0]) {
                        processarArquivoImagem(e.target.files[0], callback);
                    }
                };
                input.click();
            } else {
                alert('Seu dispositivo não suporta câmera. Use a opção "Carregar".');
            }
        }

        }

        function getStatusLabelFromStatus(status) {
            if (status === 'success') return 'Excelente';
            if (status === 'warning') return 'Atenção';
            return 'Crítico';
        }

        function calcularPresencaAluno(student, totalAulas) {
            if (!student || totalAulas === 0) return 0;
            var presencas = student.presencas || 0;
            return Math.round((presencas / totalAulas) * 100);
        }

        function getPresencaClass(percentual) {
            if (percentual >= 75) return 'alta';
            if (percentual >= 50) return 'media';
            return 'baixa';
        }

        function calcularEstatisticasTurma(students, totalAulas) {
            if (!students || students.length === 0) {
                return {
                    averageAttendance: '0%',
                    worstQuestion: '-',
                    mediaTurma: 0,
                    aprovados: 0,
                    reprovados: 0,
                    heatmap: { 'Interpretação': 0, 'Gramática': 0, 'Pontuação': 0, 'Ortografia': 0 }
                };
            }

            var totalGpa = 0;
            var totalPresencas = 0;
            var aprovados = 0;
            var reprovados = 0;

            for (var i = 0; i < students.length; i++) {
                var s = students[i];
                totalGpa += s.gpa || 0;
                var presencaPercent = calcularPresencaAluno(s, totalAulas);
                totalPresencas += presencaPercent;

                if ((s.gpa || 0) >= CONFIG.NOTA_MINIMA_APROVACAO) {
                    aprovados++;
                } else {
                    reprovados++;
                }
            }

            var avgGpa = (totalGpa / students.length);
            var mediaTurma = parseFloat(avgGpa.toFixed(1));
            var avgPresenca = students.length > 0 ? Math.round(totalPresencas / students.length) : 0;

            var worstQuestion = '-';
            var minGrade = 10;
            for (var j = 0; j < students.length; j++) {
                var hist = students[j].history || [];
                for (var k = 0; k < hist.length; k++) {
                    if (hist[k].grade < minGrade) {
                        minGrade = hist[k].grade;
                        worstQuestion = hist[k].title || 'Questão';
                    }
                }
            }

            return {
                averageAttendance: avgPresenca + '%',
                worstQuestion: worstQuestion,
                mediaTurma: mediaTurma,
                aprovados: aprovados,
                reprovados: reprovados,
                heatmap: {
                    'Interpretação': 75,
                    'Gramática': 65,
                    'Pontuação': 70,
                    'Ortografia': 85
                }
            };
        }

        function updateStudentStats(student) {
            var history = student.history || [];
            var total = history.length;
            if (total === 0) {
                student.gpa = 0;
                student.lastGrade = 0;
                student.testCount = 0;
                student.successRate = 0;
                student.trend = 'up';
                student.status = 'regular';
                return student;
            }
            var sum = 0;
            var successSum = 0;
            var last = history[history.length - 1] || { grade: 0 };
            for (var i = 0; i < history.length; i++) {
                sum += history[i].grade || 0;
                var totalQ = (history[i].correct || 0) + (history[i].wrong || 0);
                if (totalQ > 0) {
                    successSum += ((history[i].correct || 0) / totalQ) * 100;
                }
            }
            student.gpa = parseFloat((sum / total).toFixed(1));
            student.lastGrade = last.grade || 0;
            student.testCount = total;
            student.successRate = Math.round(successSum / total);
            student.trend = 'up';
            if (history.length >= 2) {
                var lastTwo = history.slice(-2);
                if (lastTwo[1].grade < lastTwo[0].grade) student.trend = 'down';
            }
            student.status = getStatusClass(student.gpa);
            return student;
        }

        function avaliarAluno(student, mediaTurma) {
            if (!student || mediaTurma === undefined) return { status: 'regular', label: 'Regular', diff: 0 };
            var diff = student.gpa - mediaTurma;
            var status = 'regular';
            var label = 'Regular';
            if (diff >= 1.0) {
                status = 'otimo';
                label = 'Ótimo (Acima da média)';
            } else if (diff >= 0.5) {
                status = 'bom';
                label = 'Bom (Próximo da média)';
            } else if (diff >= -0.5) {
                status = 'regular';
                label = 'Regular (Na média)';
            } else {
                status = 'ruim';
                label = 'Ruim (Abaixo da média)';
            }
            return {
                status: status,
                label: label,
                diff: diff
            };
        }

        function getSortedStudents(list) {

            if (filter === 'aprovados') result = result.filter(function(s) { return s.gpa >= CONFIG.NOTA_MINIMA_APROVACAO; });
            else if (filter === 'recuperacao') result = result.filter(function(s) { return s.gpa < CONFIG.NOTA_MINIMA_APROVACAO; });

            if (search) result = result.filter(function(s) { return s.name.toLowerCase().indexOf(search) !== -1; });

            switch (App.activeSort) {
                case 'alfabetica':
                    return result.sort(function(a, b) { return a.name.localeCompare(b.name); });

                case 'pior-desempenho':
                    return result.sort(function(a, b) { return a.gpa - b.gpa; });
                default:
                    return result;
            }

        async function handleRegister() {
            const nome = document.getElementById('regNome').value.trim();
            const sobrenome = document.getElementById('regSobrenome').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const senha = document.getElementById('regSenha').value;
            const confirmSenha = document.getElementById('regConfirmSenha').value;
            const termos = document.getElementById('regTermos').checked;

            if (!nome) { App.errorMsg = 'Por favor, insira seu nome.'; render(); return; }
            if (!sobrenome) { App.errorMsg = 'Por favor, insira seu apelido.'; render(); return; }
            if (!email) { App.errorMsg = 'Por favor, insira seu e-mail.'; render(); return; }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { App.errorMsg = 'Por favor, insira um e-mail válido.'; render(); return; }
            
            if (!senha) { App.errorMsg = 'Por favor, insira uma senha.'; render(); return; }
            if (senha.length < 6) { App.errorMsg = 'A senha deve ter pelo menos 6 caracteres.'; render(); return; }
            if (senha !== confirmSenha) { App.errorMsg = 'As senhas não coincidem.'; render(); return; }
            if (!termos) { App.errorMsg = 'Você precisa aceitar os termos.'; render(); return; }

            App.isLoading = true;
            App.errorMsg = '';
            render();

            try {
                await apiRegister({ nome, sobrenome, email, senha });
                App.isLoading = false;
                App.mensagemToast = 'Conta criada com sucesso!';
                App.showSyncSuccess = true;
                await carregarTurmas();
                setTimeout(() => {
                    App.showSyncSuccess = false;
                    navigateTo('dashboard');
                }, 2000);
                render();
            } catch (error) {
                App.isLoading = false;
                App.errorMsg = error.message;
                render();
            }
        }

        // ============================================================
        // GESTÃO DE SALAS (ATUALIZADA)
        // ============================================================
        function renderSalas() {
            const filtro = App.salasFilter;
            
            // Filtrar turmas
            let turmasFiltradas = [...App.classes];
            
            if (filtro.busca) {
                const termo = filtro.busca.toLowerCase();
                turmasFiltradas = turmasFiltradas.filter(t => 
                    t.name.toLowerCase().includes(termo)
                );
            }
            
            if (filtro.status !== 'todos') {
                turmasFiltradas = turmasFiltradas.filter(t => t.status === filtro.status);
            }
            
            if (filtro.nivel !== 'todos') {
                turmasFiltradas = turmasFiltradas.filter(t => 
                    t.nivel && t.nivel.toLowerCase().includes(filtro.nivel.toLowerCase())
                );
            }
            
            // Ordenação
            switch (filtro.ordenar) {
                case 'nome':
                    turmasFiltradas.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'media':
                    turmasFiltradas.sort((a, b) => b.average - a.average);
                    break;
                case 'alunos':
                    turmasFiltradas.sort((a, b) => b.studentCount - a.studentCount);
                    break;
                case 'recente':
                default:
                    break;
            }
            
            // Calcular estatísticas gerais
            const totalTurmas = App.classes.length;
            const totalAlunos = App.classes.reduce((acc, t) => acc + (t.studentCount || 0), 0);
            const mediaGeral = totalTurmas > 0 
                ? (App.classes.reduce((acc, t) => acc + (t.average || 0), 0) / totalTurmas).toFixed(1)
                : '0.0';
            const turmasAlerta = App.classes.filter(t => t.status === 'warning').length;
            const turmasCriticas = App.classes.filter(t => t.status === 'danger').length;
            
            // HTML das estatísticas
            const statsHtml = `

        // ============================================================
        // FUNÇÕES AUXILIARES - GESTÃO DE SALAS
        // ============================================================
        function toggleMenuTurma(turmaId, event) {
            event.stopPropagation();
            
            document.querySelectorAll('[id^="menu-turma-"]').forEach(menu => {
                if (menu.id !== `menu-turma-${turmaId}`) {
                    menu.classList.add('hidden');
                }
            });
            
            const menu = document.getElementById(`menu-turma-${turmaId}`);
            if (menu) {
                menu.classList.toggle('hidden');
            }
            
            setTimeout(() => {
                document.addEventListener('click', function fecharMenu(e) {
                    if (!e.target.closest(`#menu-turma-${turmaId}`)) {
                        const menu = document.getElementById(`menu-turma-${turmaId}`);
                        if (menu) menu.classList.add('hidden');
                        document.removeEventListener('click', fecharMenu);
                    }
                });
            }, 100);
        }

        async function editarTurma(turmaId) {
            try {
                const result = await apiBuscarTurma(turmaId);
                const turma = result.turma;
                
                const novoNome = prompt('Nome da turma:', turma.nome);
                if (novoNome === null) return;
                
                const novoNivel = prompt('Nível (Ensino Básico / Ensino Secundário / Ensino Profissional):', turma.nivel);
                if (novoNivel === null) return;
                
                const novoStatus = prompt('Status (success / warning / danger):', turma.status);
                if (novoStatus === null) return;
                
                await apiAtualizarTurma(turmaId, {
                    nome: novoNome.trim(),
                    nivel: novoNivel.trim(),
                    status: novoStatus.trim(),
                    total_aulas: turma.total_aulas
                });
                
                await carregarTurmas();
                
                App.mensagemToast = 'Turma atualizada com sucesso!';
                App.showSyncSuccess = true;
                render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);
                
            } catch (error) {
                App.mensagemErro = 'Erro ao editar turma: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(() => { App.showSyncError = false; render(); }, 3000);
            }
        }

        async function duplicarTurma(turmaId) {
            if (!confirm('Deseja duplicar esta turma? Alunos não serão copiados.')) return;
            
            try {
                await apiDuplicarTurma(turmaId);
                await carregarTurmas();
                
                App.mensagemToast = 'Turma duplicada com sucesso!';
                App.showSyncSuccess = true;
                render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);
                
            } catch (error) {
                App.mensagemErro = 'Erro ao duplicar turma: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(() => { App.showSyncError = false; render(); }, 3000);
            }
        }

        async function excluirTurma(turmaId, turmaNome) {
            if (!confirm(`⚠️ ATENÇÃO!\n\nDeseja realmente excluir a turma "${turmaNome}"?\n\nTodos os alunos e notas associados serão removidos.\n\nEsta ação não pode ser desfeita.`)) {
                return;
            }
            
            try {
                await apiDeletarTurma(turmaId);
                await carregarTurmas();
                
                App.mensagemToast = 'Turma excluída com sucesso!';
                App.showSyncSuccess = true;
                render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);
                
            } catch (error) {
                App.mensagemErro = 'Erro ao excluir turma: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(() => { App.showSyncError = false; render(); }, 3000);
            }
        }

                '<button onclick="cancelarNota()" class="flex-1 btn-secondary">Cancelar</button>' +
                '</div></div></div>';

        function abrirModalNota(alunoId) {
            App.modalNota.alunoId = alunoId;
            App.modalNota.titulo = '';
            App.modalNota.nota = 0;
            App.modalNota.data = new Date().toISOString().split('T')[0];
            App.mostrarModalNota = true;
            render();
        }

        function cancelarNota() {
            App.mostrarModalNota = false;
            App.modalNota = { alunoId: '', titulo: '', nota: 0, data: '' };
            render();
        }

        async function confirmarNota() {
            var cls = App.selectedClass;
            if (!cls) return;

            var alunoId = App.modalNota.alunoId;
            var titulo = App.modalNota.titulo.trim();
            var nota = App.modalNota.nota;
            var data = App.modalNota.data || new Date().toISOString().split('T')[0];

            if (!titulo) {
                alert('Por favor, insira um título para a prova.');
                return;
            }
            if (nota <= 0 || nota > 10) {
                alert('Por favor, insira uma nota válida entre 0 e 10.');
                return;
            }

            try {
                await apiAdicionarNota(alunoId, {
                    titulo: titulo,
                    nota: nota,
                    data: data,
                    acertos: Math.round(nota * 2),
                    erros: Math.round((10 - nota) * 2),
                    questoes_detalhes: getRandomDetails(20)
                });

                await selectClass(cls.id);

                App.mostrarModalNota = false;
                App.mensagemToast = 'Nota adicionada com sucesso!';
                App.showSyncSuccess = true;
                render();
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) {
                App.mensagemErro = 'Erro ao adicionar nota: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(function() { App.showSyncError = false; render(); }, 3000);
            }
        }

        function adicionarAula() {
            var cls = App.selectedClass;
            if (!cls) return;

            cls.totalAulas = (cls.totalAulas || 0) + 1;
            App.mensagemToast = 'Aula registrada com sucesso! Total: ' + cls.totalAulas + ' aulas.';
            App.showSyncSuccess = true;
            render();
            setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
        }

        function adicionarAluno() {
            var novoAluno = {
                id: generateId(),
                number: (App.novaTurma.alunos || []).length + 1,
                name: 'Aluno ' + ((App.novaTurma.alunos || []).length + 1),
                gpa: 0,
                lastGrade: 0,
                testCount: 0,
                successRate: 0,
                trend: 'up',
                faltas: 0,
                presencas: 0,
                history: []
            };
            App.novaTurma.alunos.push(novoAluno);
            render();
        }

        function removerAluno(id) {
            if (confirm('Deseja remover este aluno?')) {
                App.novaTurma.alunos = App.novaTurma.alunos.filter(function(a) { return a.id !== id; });
                for (var i = 0; i < App.novaTurma.alunos.length; i++) {
                    App.novaTurma.alunos[i].number = i + 1;
                }
                render();
            }
        }

        function editarAluno(id) {
            var aluno = null;
            for (var i = 0; i < App.novaTurma.alunos.length; i++) {
                if (App.novaTurma.alunos[i].id === id) {
                    aluno = App.novaTurma.alunos[i];
                    break;
                }
            }
            if (!aluno) return;

            var novoNome = prompt('Nome do aluno:', aluno.name);
            if (novoNome !== null && novoNome.trim()) {
                aluno.name = novoNome.trim();
            }

            var novaNota = prompt('Média Geral (0-10):', aluno.gpa);
            if (novaNota !== null) {
                var gpa = parseFloat(novaNota);
                if (!isNaN(gpa) && gpa >= 0 && gpa <= 10) {
                    aluno.gpa = gpa;
                    aluno.lastGrade = gpa;
                }
            }
            render();
        }

        async function salvarTurma() {
            var nome = App.novaTurma.nome.trim();
            if (!nome) {
                alert('Por favor, insira um nome para a turma.');
                return;
            }

            try {
                const turma = await apiCriarTurma({
                    nome: nome,
                    nivel: App.novaTurma.nivel,
                    status: App.novaTurma.status,
                    total_aulas: App.novaTurma.totalAulas || 0
                });

                for (var i = 0; i < App.novaTurma.alunos.length; i++) {
                    await apiAdicionarAluno({
                        turma_id: turma.id,
                        numero: App.novaTurma.alunos[i].number,
                        nome: App.novaTurma.alunos[i].name,
                        gpa: App.novaTurma.alunos[i].gpa || 0
                    });
                }

                App.novaTurma = {
                    nome: '',
                    nivel: 'Ensino Básico',
                    status: 'success',
                    totalAulas: 0,
                    alunos: [],
                    statistics: {
                        averageAttendance: '0%',
                        worstQuestion: '-',
                        mediaTurma: 0,
                        aprovados: 0,
                        reprovados: 0,
                        heatmap: { 'Interpretação': 0, 'Gramática': 0, 'Pontuação': 0, 'Ortografia': 0 }
                    }
                };
                App.isCreating = false;
                App.activeTab = 'config';

                await carregarTurmas();
                navigateTo('salas');
            } catch (error) {
                alert('Erro ao salvar turma: ' + error.message);
            }
        }

        function cancelarTurma() {

                nivel: 'Ensino Básico',
                status: 'success',
                totalAulas: 0,
                alunos: [],

                    averageAttendance: '0%',
                    worstQuestion: '-',
                    mediaTurma: 0,
                    aprovados: 0,
                    reprovados: 0,

                }
            };
            App.isCreating = false;
            App.activeTab = 'config';
            navigateTo('salas');
        }

        function initScan() {
            const video = document.getElementById('scanVideo');
            if (video) {
                startScan();
            }
        }

        function startScan() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(function(stream) {
                        App.scanStream = stream;
                        const video = document.getElementById('scanVideo');
                        if (video) {
                            video.srcObject = stream;
                        }
                    })
                    .catch(function(err) {
                        console.warn('Câmara indisponível:', err);
                    });
            }
        }

        function stopScan() {
            if (App.scanStream) {
                App.scanStream.getTracks().forEach(function(track) { track.stop(); });
                App.scanStream = null;
            }
        }

        function captureScan() {
            const video = document.getElementById('scanVideo');
            const canvas = document.getElementById('scanCanvas');
            if (video && canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const flash = document.createElement('div');
                flash.style.cssText = 'position:fixed; inset:0; background:white; z-index:9999; transition: opacity 0.3s;';
                document.body.appendChild(flash);
                setTimeout(() => flash.style.opacity = '0', 100);
                setTimeout(() => flash.remove(), 500);
                
                const dataUrl = canvas.toDataURL('image/jpeg');
                stopScan();
                App.studentGabarito = {
                    dataUrl: dataUrl,
                    mimeType: 'image/jpeg',
                    base64: dataUrl.split(',')[1]
                };
                render();
            }
        }

        function handleScanFallback(event) {
            const file = event.target.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) {
                    App.studentGabarito = result;
                    render();
                });
            }
        }

                            <div class="absolute top-0 left-0 w-2 h-full bg-[#7aa2a1]"></div>
                            <h3 class="font-bold text-gray-800 dark:text-white text-sm mb-3 pl-2 flex items-center gap-2">
                                <i class="fas fa-check-circle text-[#7aa2a1]"></i> 1. Gabarito de Correção
                            </h3>
                            
                            <div class="flex-1 min-h-[180px]">
                                ${hasOfficial ? `
                                    <div class="relative rounded-xl overflow-hidden border dark:border-slate-600">
                                        <img src="${App.localOfficial.dataUrl}" alt="Gabarito" class="w-full max-h-48 object-contain" />
                                        <button onclick="App.localOfficial=null;render();" 
                                            class="absolute top-2 right-2 bg-red-500 text-white p-1.5 rounded-full shadow hover:bg-red-600 transition-colors">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                ` : `
                                    <div class="drop-zone w-full h-full flex flex-col items-center justify-center"
                                        onclick="document.getElementById('discursiveOfficial').click()"
                                        ondrop="handleDropDiscursiveOfficial(event)"
                                        ondragover="event.preventDefault(); this.classList.add('dragover')"
                                        ondragleave="event.preventDefault(); this.classList.remove('dragover')">
                                        <i class="fas fa-cloud-upload-alt text-4xl text-[#7aa2a1] mb-3"></i>
                                        <p class="text-sm font-bold text-[#7aa2a1]">Carregar Gabarito</p>
                                        <p class="text-xs text-gray-400 mt-1">Arraste ou clique</p>
                                    </div>
                                    <input type="file" id="discursiveOfficial" class="hidden" accept="image/*,.pdf" onchange="handleDiscursiveOfficial(event)" />
                                `}
                            </div>
                        </div>
                        
                        <div class="bg-white dark:bg-slate-700 p-6 rounded-3xl border border-gray-100 dark:border-slate-600 shadow-sm flex flex-col relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-2 h-full bg-[#7aa2a1]"></div>
                            <h3 class="font-bold text-gray-800 dark:text-white text-sm mb-3 pl-2 flex items-center gap-2">
                                <i class="fas fa-qrcode text-[#7aa2a1]"></i> 2. Resposta do Aluno
                            </h3>
                            
                            <div class="flex-1 min-h-[180px]">
                                ${hasStudent ? `
                                    <div class="relative rounded-xl overflow-hidden border dark:border-slate-600">
                                        <img src="${App.studentAnswer.dataUrl}" alt="Resposta do Aluno" class="w-full max-h-48 object-contain" />
                                        <button onclick="App.studentAnswer=null;render();" 
                                            class="absolute top-2 right-2 bg-red-500 text-white p-1.5 rounded-full shadow hover:bg-red-600 transition-colors">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                ` : `
                                    <div class="drop-zone w-full h-full flex flex-col items-center justify-center"
                                        onclick="document.getElementById('discursiveStudent').click()"
                                        ondrop="handleDropDiscursiveStudent(event)"
                                        ondragover="event.preventDefault(); this.classList.add('dragover')"
                                        ondragleave="event.preventDefault(); this.classList.remove('dragover')">
                                        <i class="fas fa-cloud-upload-alt text-4xl text-[#7aa2a1] mb-3"></i>
                                        <p class="text-sm font-bold text-[#7aa2a1]">Carregar Redação</p>
                                        <p class="text-xs text-gray-400 mt-1">Arraste ou clique</p>
                                    </div>
                                    <input type="file" id="discursiveStudent" class="hidden" accept="image/*,.pdf" onchange="handleDiscursiveStudent(event)" />
                                `}
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-center">
                        <button onclick="handleDiscursiveAnalyze()" 
                            ${(App.isAnalyzing || !hasOfficial || !hasStudent) ? 'disabled' : ''}
                            class="w-full max-w-md py-4 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transition-all
                                ${(App.isAnalyzing || !hasOfficial || !hasStudent) ? 'bg-gray-400 cursor-not-allowed' : 'bg-[#7aa2a1] hover:bg-[#688f8e] active:scale-95'}">
                            ${App.isAnalyzing ? 
                                '<i class="fas fa-sync-alt animate-spin"></i> A analisar...' : 
                                '<i class="fas fa-lightbulb"></i> Realizar Correção por IA'}
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function handleDropDiscursiveOfficial(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) {
                    App.localOfficial = result;
                    render();
                });
            }
        }

        function handleDropDiscursiveStudent(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) {
                    App.studentAnswer = result;
                    render();
                });
            }
        }

        function handleDiscursiveOfficial(event) {
            const file = event.target.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) {
                    App.localOfficial = result;
                    render();
                });
            }
        }

        function handleDiscursiveStudent(event) {
            const file = event.target.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) {
                    App.studentAnswer = result;
                    render();
                });
            }
        }

        function handleDiscursiveAnalyze() {
            if (!App.localOfficial || !App.studentAnswer) {
                App.errorMsg = 'Por favor, carregue o gabarito oficial e a prova do aluno.';
                render();
                return;
            }

            App.errorMsg = '';
            App.isAnalyzing = true;
            render();

            setTimeout(function() {
                App.aiResult = '***Avaliação Pedagógica***\n\n**Aluno:** Aluno\n**Nota Obtida:** 7.5/10\n\n**Análise:**\nO aluno demonstra bom entendimento.\n\n*Recomendações:*\n- Praticar mais exercícios\n- Revisar a estrutura';
                App.isAnalyzing = false;
                navigateTo('ai_result');
            }, 2000);
        }

        // ============================================================
        // AI RESULT
        // ============================================================
        function renderAiResult() {
            const result = App.aiResult || 'Nenhum resultado disponível.';
            
            return `
            <div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">
                ${renderSimpleHeader('Resultado da Avaliação por IA')}
                
                <div class="flex-1 p-6 overflow-y-auto">
                    <div class="bg-[#e8f1f1] dark:bg-slate-700/50 p-6 rounded-2xl border dark:border-slate-600">
                        <h3 class="font-bold text-gray-800 dark:text-white mb-4">Resultado da Avaliação</h3>
                        <p class="text-sm text-gray-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap">${result}</p>
                    </div>
                    
                    <button onclick="navigateTo('dashboard')" class="mt-8 w-full btn-solid flex items-center justify-center gap-2">
                        <i class="fas fa-check-circle"></i> Voltar ao Painel
                    </button>
                </div>
            </div>`;
        }

        // ============================================================
        // APLICAR PROVA
        // ============================================================
        function renderAplicarProva() {
            return `
            <div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">
                ${renderSimpleHeader('Aplicar Prova')}
                <div class="flex-1 p-6 flex items-center justify-center">
                    <div class="text-center text-gray-400">
                        <i class="fas fa-qrcode text-6xl mb-4"></i>
                        <p class="text-lg font-bold">Funcionalidade em desenvolvimento</p>
                        <p class="text-sm">Em breve você poderá aplicar provas digitalmente.</p>
                    </div>
                </div>
            </div>`;
        }

        // ============================================================
        // INICIAR APLICAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AUTOMATIC CORRECTION - Inicializando...');
            console.log(`📡 Site: ${CONFIG.SITE_URL}`);
            console.log(`📂 GitHub: ${CONFIG.GITHUB_URL}`);
            
            setTimeout(verificarServidor, 500);

            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            if (token && user) {
                try {
                    App.user = JSON.parse(user);
                    App.profileName = App.user.nome || 'Professor';
                    App.profileEmail = App.user.email || '';
                    App.profileBio = App.user.biografia || 'Docente';
                    
                    carregarTurmas().then(() => {
                        navigateTo('dashboard');
                    });
                } catch (e) {
                    console.error('Erro ao carregar usuário:', e);
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    navigateTo('login');
                }
            } else {
                navigateTo('splash');
            }
        });
    </script>
</body>
</html>
