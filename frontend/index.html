    <!-- ============================================================
    BLOCO 2: VERIFICAÇÃO DO SERVIDOR

    <script>
        async function verificarServidor() {
            var el = document.getElementById('statusServidor');
            if (!el) return;
            
            try {
                var response = await fetch(CONFIG.API_URL + '/health', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: AbortSignal.timeout(8000)
                });
                
                if (response.ok) {
                    el.innerHTML = '🟢 Servidor Online';
                    el.className = 'status-online';
                    return true;
                } else {
                    el.innerHTML = '🟡 Servidor com problema';
                    el.className = 'status-offline';
                    return false;
                }
            } catch (error) {
                el.innerHTML = '🔴 Servidor Offline';
                el.className = 'status-offline';
                console.warn('⚠️ Servidor não acessível:', error.message);
                return false;
            }
        }

        if (!document.getElementById('statusServidor')) {
            var statusDiv = document.createElement('div');
            statusDiv.id = 'statusServidor';
            statusDiv.innerHTML = '🔄 Verificando...';
            statusDiv.className = 'status-checking';
            document.body.appendChild(statusDiv);
        }

        setInterval(verificarServidor, 15000);
        setTimeout(verificarServidor, 1000);
    </script>

    <!-- ============================================================
    BLOCO 3: API - COMUNICAÇÃO COM O BACKEND (CORRIGIDO)
    ============================================================ -->
    <script>
        function getToken() { return localStorage.getItem('token'); }

        function getHeaders() {
            var token = getToken();
            var headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        // Função auxiliar que resolve o problema da vírgula e do escopo
        function getApiUrl(endpoint) {
            return CONFIG.API_URL + endpoint;
        }

        // ============================================================
        // AUTENTICAÇÃO
        // ============================================================
        async function apiLogin(email, senha) {
            try {
                var response = await fetch(getApiUrl('/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                var data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao fazer login');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no login:', error); throw error; }
        }

        async function apiRegister(dados) {
            try {
                var response = await fetch(getApiUrl('/auth/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: dados.nome,
                        sobrenome: dados.sobrenome,
                        email: dados.email,
                        senha: dados.senha,
                        biografia: dados.biografia || 'Docente',
                        escola: dados.escola || 'Escola'
                    })
                });
                var data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao registrar');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no registro:', error); throw error; }
        }

        async function apiGetProfile() {
            var response = await fetch(getApiUrl('/auth/profile'), { headers: getHeaders() });
            var data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar perfil');
            return data.user;
        }

        async function apiUpdateProfile(dados) {
            var response = await fetch(getApiUrl('/auth/profile'), {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            var data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar perfil');
            localStorage.setItem('user', JSON.stringify(data.user));
            return data.user;
        }

        // ============================================================
        // TURMAS
        // ============================================================
        async function apiListarTurmas(filtros) {
            try {
                if (!filtros) filtros = {};
                var url = getApiUrl('/turmas');
                var params = new URLSearchParams();
                if (filtros.busca) params.append('busca', filtros.busca);
                if (filtros.status && filtros.status !== 'todos') params.append('status', filtros.status);
                if (filtros.nivel && filtros.nivel !== 'todos') params.append('nivel', filtros.nivel);
                if (filtros.ordenar) params.append('ordenar', filtros.ordenar);
                if (params.toString()) url += '?' + params.toString();
                
                var response = await fetch(url, { headers: getHeaders() });
                var data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao listar turmas');
                return data;
            } catch (error) { console.error('❌ Erro ao listar turmas:', error); throw error; }
        }

        async function apiCriarTurma(dados) {
            try {
                var response = await fetch(getApiUrl('/turmas'), {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(dados)
                });
                var data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao criar turma');
                return data.turma;
            } catch (error) { console.error('❌ Erro ao criar turma:', error); throw error; }
        }

        async function apiBuscarTurma(id) {
            try {
                var response = await fetch(getApiUrl('/turmas/' + id), { headers: getHeaders() });
                var data = await response.json();
                if (!response.ok) throw new Error(data.error || data.message || 'Erro ao buscar turma');
                return data;
            } catch (error) { console.error('❌ Erro ao buscar turma:', error); throw error; }
        }

        async function apiAtualizarTurma(id, dados) {
            var response = await fetch(getApiUrl('/turmas/' + id), {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            var data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar turma');
            return data.turma;
        }

        async function apiDeletarTurma(id) {
            var response = await fetch(getApiUrl('/turmas/' + id), {

                headers: getHeaders()

            var data = await response.json();

        async function apiDuplicarTurma(id) {

        // ============================================================
        // UPLOAD DE IMAGENS
        // ============================================================
        function processarArquivoImagem(file, callback) {
            if (!file) return;
            var tiposValidos = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
            if (tiposValidos.indexOf(file.type) === -1 && file.type.indexOf('image/') !== 0) {
                alert('Formato de arquivo não suportado. Use JPG, PNG, GIF, WEBP ou PDF.'); return;
            }
            if (file.size > 10 * 1024 * 1024) { alert('Arquivo muito grande. Máximo 10MB.'); return; }

            var reader = new FileReader();
            reader.onloadend = function() {
                callback({ dataUrl: reader.result, mimeType: file.type, base64: reader.result.split(',')[1], name: file.name, size: file.size });
            };
            reader.onerror = function() { alert('Erro ao ler o arquivo. Tente novamente.'); };
            reader.readAsDataURL(file);
        }

        function tirarFoto(callback) {
            if ('mediaDevices' in navigator && navigator.mediaDevices.getUserMedia) {
                var input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
                input.onchange = function(e) { if (e.target.files && e.target.files[0]) processarArquivoImagem(e.target.files[0], callback); };
                input.click();
            } else { alert('Seu dispositivo não suporta câmera. Use a opção "Carregar".'); }
        }
    </script>

        };

        function generateId() { return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9); }

        function getInitials(name) {
            if (!name) return '?';
            var parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        function getStatusClass(gpa) { if (gpa >= 8.0) return 'otimo'; if (gpa >= 6.0) return 'bom'; if (gpa >= 4.0) return 'regular'; return 'ruim'; }
        function getStatusIcon(gpa) { if (gpa >= 8.0) return 'fa-star'; if (gpa >= 6.0) return 'fa-check-circle'; if (gpa >= 4.0) return 'fa-exclamation-triangle'; return 'fa-times-circle'; }
        function getStatusLabel(gpa) { if (gpa >= 8.0) return 'Ótimo'; if (gpa >= 6.0) return 'Bom'; if (gpa >= 4.0) return 'Regular'; return 'Ruim'; }
        function getGradeColor(gpa) { if (gpa >= 8.0) return 'text-green-500'; if (gpa >= 6.0) return 'text-blue-500'; if (gpa >= 4.0) return 'text-yellow-500'; return 'text-red-500'; }
        function getStatusColor(status) { if (status === 'success') return 'bg-green-500'; if (status === 'warning') return 'bg-yellow-500'; return 'bg-red-500'; }
        function getStatusLabelFromStatus(status) { if (status === 'success') return 'Excelente'; if (status === 'warning') return 'Atenção'; return 'Crítico'; }
        function getRandomDetails(count) { var details = []; for (var i = 0; i < count; i++) details.push(Math.random() > 0.3 ? 1 : 0); return details; }
        function calcularPresencaAluno(student, totalAulas) { if (!student || totalAulas === 0) return 0; return Math.round(((student.presencas || 0) / totalAulas) * 100); }

        function updateStudentStats(student) {
            var history = student.history || [];
            var total = history.length;
            if (total === 0) { student.gpa = 0; student.lastGrade = 0; student.testCount = 0; student.successRate = 0; student.trend = 'up'; student.status = 'regular'; return student; }
            var sum = 0, successSum = 0;
            var last = history[history.length - 1] || { grade: 0 };
            for (var i = 0; i < history.length; i++) {
                sum += history[i].grade || 0;
                var totalQ = (history[i].correct || 0) + (history[i].wrong || 0);
                if (totalQ > 0) successSum += ((history[i].correct || 0) / totalQ) * 100;
            }
            student.gpa = parseFloat((sum / total).toFixed(1));
            student.lastGrade = last.grade || 0;
            student.testCount = total;
            student.successRate = Math.round(successSum / total);
            student.trend = 'up';
            if (history.length >= 2) { var lastTwo = history.slice(-2); if (lastTwo[1].grade < lastTwo[0].grade) student.trend = 'down'; }
            student.status = getStatusClass(student.gpa);
            return student;
        }

        function getSortedStudents(list) {
            var result = (list || []).slice();
            if (App.activeFilter === 'aprovados') result = result.filter(function(s) { return s.gpa >= CONFIG.NOTA_MINIMA_APROVACAO; });
            else if (App.activeFilter === 'recuperacao') result = result.filter(function(s) { return s.gpa < CONFIG.NOTA_MINIMA_APROVACAO; });
            var search = App.searchQuery.toLowerCase();
            if (search) result = result.filter(function(s) { return s.name.toLowerCase().indexOf(search) !== -1; });
            switch (App.activeSort) {
                case 'alfabetica': return result.sort(function(a, b) { return a.name.localeCompare(b.name); });
                case 'melhor-desempenho': return result.sort(function(a, b) { return b.gpa - a.gpa; });
                case 'pior-desempenho': return result.sort(function(a, b) { return a.gpa - b.gpa; });
                default: return result;
            }
        }

                });

            var senha = document.getElementById('regSenha').value;

            if (!termos) { App.errorMsg = 'Aceite os termos.'; render(); return; }

            App.isLoading = true; App.errorMsg = ''; render();

                await apiRegister({ nome: nome, sobrenome: sobrenome, email: email, senha: senha });

f1f1] dark:bg-slate-600 text-[#7aa2a1] dark:text-slate-100 text-xs font-bold rounded-xl hover:bg-[#d0e1e1] transition-all flex items-center justify-center gap-2"><i class="fas fa-users"></i> Ver Alunos</button><button onclick="selectClassAndNavigate(\'' + c.id + '\',\'relatorios\')" class="py-2.5 px-3 bg-gray-100 dark:bg-slate-600/50 text-gray-600 dark:text-slate-300 text-xs font-bold rounded-xl hover:bg-gray-200 transition-all flex items-center justify-center gap-2"><i class="fas fa-chart-bar"></i> Relatórios</button></div></div></div>';

            } else { alunosHtml += '<div class="empty-state"><i class="fas fa-user-plus"></i><h3>Nenhum aluno</h3></div>'; }
            alunosHtml += '</div></div>';
            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full"><div class="flex items-center justify-between p-6 border-b border-gray-100 dark:border-slate-700"><button onclick="navigateTo(\'salas\')" class="text-gray-400 hover:text-black"><i class="fas fa-arrow-left text-2xl"></i></button><h2 class="text-lg font-black text-gray-700 dark:text-slate-100">Nova Turma</h2><div class="w-6"></div></div><div class="p-6 flex-1 overflow-y-auto"><div class="flex gap-2 mb-6 border-b dark:border-slate-700 pb-4"><button class="tab-button ' + (tab === 'config' ? 'active' : '') + '" onclick="App.activeTab=\'config\';render();"><i class="fas fa-cog"></i> Configurações</button><button class="tab-button ' + (tab === 'alunos' ? 'active' : '') + '" onclick="App.activeTab=\'alunos\';render();"><i class="fas fa-users"></i> Alunos</button></div>' + (tab === 'config' ? configHtml : alunosHtml) + '<div class="mt-6 flex gap-4"><button onclick="salvarTurma()" class="flex-1 btn-solid">💾 Salvar Turma</button><button onclick="cancelarTurma()" class="flex-1 btn-secondary">Cancelar</button></div></div></div>';
        }

        function adicionarAluno() { App.novaTurma.alunos.push({ id: generateId(), number: (App.novaTurma.alunos || []).length + 1, name: 'Aluno ' + ((App.novaTurma.alunos || []).length + 1), gpa: 0 }); render(); }
        function removerAluno(id) { App.novaTurma.alunos = App.novaTurma.alunos.filter(function(a) { return a.id !== id; }); render(); }
        async function salvarTurma() {
            if (!App.novaTurma.nome.trim()) { alert('Insira um nome.'); return; }
            try {
                var turma = await apiCriarTurma({ nome: App.novaTurma.nome, nivel: App.novaTurma.nivel, status: App.novaTurma.status });
                for (var i = 0; i < App.novaTurma.alunos.length; i++) { await apiAdicionarAluno({ turma_id: turma.id, numero: App.novaTurma.alunos[i].number, nome: App.novaTurma.alunos[i].name }); }
                App.novaTurma = { nome: '', nivel: 'Ensino Básico', status: 'success', alunos: [] };
                await carregarTurmas(); navigateTo('salas');
            } catch (error) { alert('Erro: ' + error.message); }
        }
        function cancelarTurma() { App.novaTurma = { nome: '', nivel: 'Ensino Básico', status: 'success', alunos: [] }; navigateTo('salas'); }

        function renderRelatorios() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full">' + renderSimpleHeader('Relatórios') + '<div class="p-6">Em breve.</div></div>'; }
        function renderImport() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Importar') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderScan() { return '<div class="flex-1 flex flex-col bg-[#0a0a0a] text-white w-full max-w-4xl mx-auto">' + renderSimpleHeader('Digitalizar') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderConfirm() { return '<div class="flex-1 flex flex-col p-6 text-center"><p>Confirmação em breve.</p></div>'; }
        function renderResults() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Correção') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderCompare() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full">' + renderSimpleHeader('Comparação') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderTips() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Sugestões') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderCharts() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Gráficos') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderDiscursive() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Discursiva') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderAiResult() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Resultado IA') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }
        function renderAplicarProva() { return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' + renderSimpleHeader('Aplicar') + '<div class="p-6 text-center"><p>Funcionalidade em breve.</p></div></div>'; }

        // ============================================================
        // INICIAR APLICAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AUTOMATIC CORRECTION - Inicializando...');
            setTimeout(verificarServidor, 1000);
            var token = localStorage.getItem('token');
            var user = localStorage.getItem('user');
            if (token && user) {
                try {
                    App.user = JSON.parse(user); App.profileName = App.user.nome || 'Professor'; App.profileEmail = App.user.email || ''; App.profileBio = App.user.biografia || 'Docente';
                    carregarTurmas().then(function() { navigateTo('dashboard'); });
                } catch (e) { localStorage.removeItem('token'); localStorage.removeItem('user'); navigateTo('login'); }
            } else { navigateTo('splash'); }
        });
    </script>
</body>
</html>
