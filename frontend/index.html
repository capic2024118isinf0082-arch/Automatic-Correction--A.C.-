<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Correction</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#7aa2a1',
                        secondary: '#688f8e'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Animação do Toast */

        .btn-info { @apply bg-blue-500 text-white font-bold py-2 px-4 rounded-xl hover:bg-blue-600 transition-colors; }
        .input-style { @apply w-full p-3 bg-gray-50 dark:bg-slate-700 border dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1] dark:text-white; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 transition-colors duration-300">
    <!-- Container Principal -->
    <div id="app"></div>

    <!-- BLOCO 1: CONFIGURAÇÃO -->
    <script>
        const DOMAIN_CONFIG = {
            render: 'https://automatic-correction-t5h6.onrender.com',
            netlify: 'https://automaticcorrection.netlify.app',
            development: 'http://localhost:3000'
        };

        const hostname = window.location.hostname;
        const isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '';
        
        let SITE_URL;
        let environmentLabel;

        if (isLocalhost) {
            SITE_URL = DOMAIN_CONFIG.development;
            environmentLabel = 'Desenvolvimento (localhost)';
        } else {
            SITE_URL = DOMAIN_CONFIG.render;
            environmentLabel = hostname.endsWith('.netlify.app') ? 'Produção (Netlify → Render)' : 'Produção (Render)';
        }

        SITE_URL = SITE_URL.replace(/\/+$/, '');
        const API_URL = `${SITE_URL}/api`;

        const CONFIG = {
            SITE_URL: SITE_URL,
            API_URL: API_URL,
            APP_NAME: 'Automatic Correction',
            APP_VERSION: '1.2.0',
            NOTA_MINIMA_APROVACAO: 6.0
        };

        window.CONFIG = CONFIG;
        window.API_URL = API_URL;
        window.SITE_URL = SITE_URL;

        console.log(`%c AUTOMATIC CORRECTION v${CONFIG.APP_VERSION}`, 'color:#7aa2a1;font-weight:bold;font-size:14px');
        console.log(`Ambiente: ${environmentLabel}`);
        console.log(`API: ${API_URL}`);
    </script>

    <!-- BLOCO 2: VERIFICAÇÃO DO SERVIDOR -->
    <script>
        let _lastServerStatus = null;
        async function verificarServidor() {
            const el = document.getElementById('statusServidor');
            if (!el) return;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                const response = await fetch(`${CONFIG.API_URL}/health`, { 
                    method: 'GET', 
                    headers: {'Accept': 'application/json'}, 
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    el.className = 'fixed bottom-4 left-4 bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg z-50';
                    el.innerHTML = '● Servidor Online';
                    if (_lastServerStatus !== 'online') { console.log('Backend online.'); _lastServerStatus = 'online'; }
                } else {
                    el.className = 'fixed bottom-4 left-4 bg-yellow-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg z-50';
                    el.innerHTML = '● Servidor Instável';
                    _lastServerStatus = 'degraded';
                }
            } catch (error) {
                el.className = 'fixed bottom-4 left-4 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg z-50';
                el.innerHTML = '● Servidor Offline';
                _lastServerStatus = 'offline';
            }
        }

        // Cria o indicador
        if (!document.getElementById('statusServidor')) {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'statusServidor';
            statusDiv.className = 'fixed bottom-4 left-4 bg-gray-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg z-50';
            statusDiv.innerHTML = '● Verificando...';
            document.body.appendChild(statusDiv);
        }
        
        setTimeout(verificarServidor, 1000);
        setInterval(verificarServidor, 30000);
    </script>

    <!-- BLOCO 3: API -->
    <script>
        window.API_URL = CONFIG.API_URL;

        function getToken() { return localStorage.getItem('token'); }
        function getHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        // AUTENTICAÇÃO
        async function apiLogin(email, senha) {
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao fazer login');
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            return data;
        }

        async function apiRegister(dados) {
            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao registrar');
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            return data;
        }

        // TURMAS
        async function apiListarTurmas(filtros = {}) {
            let url = `${API_URL}/turmas`;
            const params = new URLSearchParams();
            if (filtros.busca) params.append('busca', filtros.busca);
            if (filtros.status && filtros.status !== 'todos') params.append('status', filtros.status);
            if (params.toString()) url += `?${params.toString()}`;
            const response = await fetch(url, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao listar turmas');
            return data;
        }

        async function apiCriarTurma(dados) {
            const response = await fetch(`${API_URL}/turmas`, {
                method: 'POST', headers: getHeaders(), body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao criar turma');
            return data.turma;
        }

        async function apiBuscarTurma(id) {
            const response = await fetch(`${API_URL}/turmas/${id}`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar turma');
            return data;
        }

        async function apiAtualizarTurma(id, dados) {
            const response = await fetch(`${API_URL}/turmas/${id}`, {
                method: 'PUT', headers: getHeaders(), body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar turma');
            return data.turma;
        }

        async function apiDeletarTurma(id) {
            const response = await fetch(`${API_URL}/turmas/${id}`, { method: 'DELETE', headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao deletar turma');
            return data;
        }

        async function apiRegistrarAula(turmaId, totalAulasAtual, turmaCompleta) {
            const novoTotal = (parseInt(totalAulasAtual, 10) || 0) + 1;
            try {
                const response = await fetch(`${API_URL}/turmas/${turmaId}`, {
                    method: 'PUT', headers: getHeaders(), body: JSON.stringify({ total_aulas: novoTotal })
                });
                if (response.ok) {
                    const data = await response.json().catch(() => ({}));
                    return { total_aulas: novoTotal, turma: data.turma || null };
                }
            } catch (e) { /* Fallback abaixo */ }
            
            if (turmaCompleta) {
                const turmaAtualizada = await apiAtualizarTurma(turmaId, {
                    nome: turmaCompleta.nome, nivel: turmaCompleta.nivel, status: turmaCompleta.status, total_aulas: novoTotal
                });
                return { total_aulas: novoTotal, turma: turmaAtualizada };
            }
            throw new Error('Não foi possível registrar a aula.');
        }

        // ALUNOS
        async function apiAdicionarAluno(dados) {
            const response = await fetch(`${API_URL}/alunos`, {
                method: 'POST', headers: getHeaders(), body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao adicionar aluno');
            return data.aluno;
        }

        async function apiAdicionarAlunoTurma(turmaId, dados) {
            const payload = { turma_id: turmaId, numero: dados.numero, nome: dados.nome, gpa: dados.gpa || 0 };
            return apiAdicionarAluno(payload);
        }

        async function apiListarAlunos(turmaId) {
            const response = await fetch(`${API_URL}/alunos/turma/${turmaId}`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao listar alunos');
            return data.alunos || [];
        }

        async function apiBuscarAluno(id) {
            const response = await fetch(`${API_URL}/alunos/${id}`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar aluno');
            return data;
        }

        async function apiRemoverAluno(id) {
            const response = await fetch(`${API_URL}/alunos/${id}`, { method: 'DELETE', headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao remover aluno');
            return data;
        }

        // CORREÇÃO (Futuro)
        async function apiCorrigirProva(payload) {
            try {
                const response = await fetch(`${API_URL}/correcoes`, {
                    method: 'POST', headers: getHeaders(), body: JSON.stringify(payload)
                });
                if (response.status === 404 || response.status === 501) {
                    const err = new Error('Endpoint indisponível'); err.code = 'ENDPOINT_INDISPONIVEL'; throw err;
                }
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro na correção');
                return data;
            } catch (error) {
                if (error.name === 'TypeError' || error.name === 'AbortError') error.code = 'ENDPOINT_INDISPONIVEL';
                throw error;
            }
        }

        async function apiAplicarProva(payload) {
            try {
                const response = await fetch(`${API_URL}/provas`, {
                    method: 'POST', headers: getHeaders(), body: JSON.stringify(payload)
                });
                if (response.status === 404 || response.status === 501) {
                    const err = new Error('Endpoint indisponível'); err.code = 'ENDPOINT_INDISPONIVEL'; throw err;
                }
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao aplicar prova');
                return data;
            } catch (error) {
                if (error.name === 'TypeError' || error.name === 'AbortError') error.code = 'ENDPOINT_INDISPONIVEL';
                throw error;
            }
        }

        function isEndpointIndisponivel(error) {
            if (!error) return false;
            if (error.code === 'ENDPOINT_INDISPONIVEL') return true;
            if (error.status === 404 || error.status === 501) return true;
            if (error.name === 'TypeError' || error.name === 'AbortError') return true;
            return false;
        }
    </script>

    <!-- BLOCO 4: APP -->
    <script>
        // ==========================================
        // ESTADO GLOBAL
        // ==========================================
        var App = {
            view: 'splash',
            sidebarOpen: false,
            theme: 'light',
            classes: [],
            selectedClass: null,
            selectedStudent: null,
            notifications: [],
            officialGabarito: null,
            studentGabarito: null,
            lastCorrectionData: null,
            showSyncSuccess: false,
            showSyncError: false,
            mensagemToast: '',
            mensagemErro: '',
            searchQuery: '',
            activeSort: 'alfabetica',
            showStatsTab: false,
            profileImage: null,
            profileName: 'Professor',
            profileBio: 'Docente',
            profileEmail: 'professor@escola.com',
            email: '',
            password: '',
            isLoading: false,
            isCorrecting: false,
            errorMsg: '',
            user: null,
            novoAlunoModal: { aberto: false, turmaId: '', nome: '', numero: 0, gpa: 0 },
            simulationMode: false,
            ultimaCorrecao: null,
            alunosPorTurma: {}
        };

        // ==========================================
        // CONTROLE DO MENU E NAVEGAÇÃO
        // ==========================================
        function toggleSidebar() {
            App.sidebarOpen = !App.sidebarOpen;
            render();
        }

        function navigateTo(view) {
            App.view = view;
            App.sidebarOpen = false; // Força o fechamento do menu ao navegar
            App.errorMsg = '';
            render();
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            App.user = null;
            App.view = 'login';
            App.sidebarOpen = false;
            render();
        }

        // ==========================================
        // RENDERIZAÇÃO PRINCIPAL
        // ==========================================
        function render() {
            var appDiv = document.getElementById('app');
            if (!appDiv) return;

            // Aplica o tema
            if (App.theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            var html = '';
            switch (App.view) {
                case 'splash': html = renderSplash(); break;
                case 'login': html = renderLogin(); break;
                case 'register': html = renderRegister(); break;
                case 'dashboard': html = renderDashboard(); break;
                case 'salas': html = renderSalas(); break;
                case 'sala_detalhe': html = renderSalaDetalhe(); break;
                case 'results': html = renderResults(); break;
                case 'charts': html = renderCharts(); break;
                case 'compare': html = renderCompare(); break;
                case 'apply_exam': html = renderAplicarProva(); break;
                case 'profile': html = renderProfile(); break;
                default: html = `<div class="p-10 text-center text-red-500">Tela não encontrada: ${App.view}</div>`;
            }

            // Monta a estrutura principal
            appDiv.innerHTML = `
                <div class="flex h-screen bg-gray-50 dark:bg-slate-900 transition-colors duration-300">
                    ${renderSidebar()}
                    <main class="flex-1 flex flex-col overflow-hidden relative">
                        ${html}
                    </main>
                </div>

                <!-- Toasts (Notificações) -->
                ${App.showSyncSuccess ? `
                    <div class="fixed bottom-6 right-6 bg-green-500 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-fade-in z-[100]">
                        <i class="fas fa-check-circle text-xl"></i>
                        <span class="font-bold text-sm">${App.mensagemToast || 'Sucesso!'}</span>
                    </div>
                ` : ''}

                ${App.showSyncError ? `
                    <div class="fixed bottom-6 right-6 bg-red-500 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-fade-in z-[100]">
                        <i class="fas fa-exclamation-circle text-xl"></i>
                        <span class="font-bold text-sm">${App.mensagemErro || 'Ocorreu um erro.'}</span>
                    </div>
                ` : ''}
            `;
        }

        // ==========================================
        // SIDEBAR (MENU LATERAL)
        // ==========================================
        function renderSidebar() {
            if (!App.sidebarOpen) return '';
            return `
                <div class="fixed inset-0 bg-black/50 z-40 transition-opacity" onclick="App.sidebarOpen = false; render();"></div>
                <div class="fixed inset-y-0 right-0 w-72 bg-[#1e293b] text-white shadow-2xl z-50 flex flex-col transform transition-transform duration-300">
                    <div class="flex items-center justify-between p-5 border-b border-slate-700">
                        <span class="text-lg font-bold">Menu</span>
                        <button onclick="App.sidebarOpen = false; render();" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div class="p-5 flex items-center gap-4 border-b border-slate-700">
                        <div class="w-12 h-12 rounded-full bg-slate-600 flex items-center justify-center">
                            <i class="fas fa-user text-xl text-gray-300"></i>
                        </div>
                        <div>
                            <p class="font-bold text-sm">${(App.user && App.user.nome) ? App.user.nome : 'João'}</p>
                            <p class="text-xs text-gray-400">Professor</p>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-3 space-y-1">
                        <button onclick="App.sidebarOpen = false; navigateTo('dashboard');" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700 transition-colors ${App.view === 'dashboard' ? 'bg-slate-700 text-[#7aa2a1]' : 'text-gray-300'}">
                            <i class="fas fa-sync-alt w-5 text-center"></i> Painel Principal
                        </button>
                        <button onclick="App.sidebarOpen = false; navigateTo('salas');" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700 transition-colors ${App.view === 'salas' || App.view === 'sala_detalhe' ? 'bg-slate-700 text-[#7aa2a1]' : 'text-gray-300'}">
                            <i class="fas fa-users w-5 text-center"></i> Gestão de Salas
                        </button>
                        <button onclick="App.sidebarOpen = false; navigateTo('profile');" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700 transition-colors ${App.view === 'profile' ? 'bg-slate-700 text-[#7aa2a1]' : 'text-gray-300'}">
                            <i class="fas fa-user w-5 text-center"></i> O Meu Perfil
                        </button>
                    </div>
                    <div class="p-3 border-t border-slate-700 space-y-1">
                        <button onclick="App.theme = App.theme === 'dark' ? 'light' : 'dark'; render();" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-700 text-gray-300 transition-colors">
                            <i class="fas fa-sun w-5 text-center"></i> Modo ${App.theme === 'dark' ? 'Claro' : 'Escuro'}
                        </button>
                        <button onclick="App.sidebarOpen = false; handleLogout();" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-red-900/30 text-red-400 transition-colors">
                            <i class="fas fa-sign-out-alt w-5 text-center"></i> Sair
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // TELAS BÁSICAS E HEADER
        // ==========================================
        function renderSplash() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center bg-slate-900 text-white">
                    <div class="w-20 h-20 bg-[#7aa2a1] rounded-2xl flex items-center justify-center mb-6">
                        <i class="fas fa-check-double text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-black mb-2">Automatic Correction</h1>
                    <p class="text-gray-400 mb-8">Correção inteligente de provas</p>
                    <button onclick="navigateTo('login')" class="bg-[#7aa2a1] text-white px-8 py-3 rounded-xl font-bold hover:bg-[#688f8e] transition-colors">
                        Começar <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
        }

        function renderSimpleHeader(title) {
            return `
                <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-slate-700 bg-white dark:bg-slate-800">
                    <button onclick="navigateTo('dashboard')" class="text-gray-500 hover:text-black dark:hover:text-white p-2">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <h2 class="font-bold text-gray-800 dark:text-white">${title}</h2>
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-black dark:hover:text-white p-2">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            `;
        }

        // ==========================================
        // TELAS DE ACESSO (LOGIN / REGISTRO)
        // ==========================================
        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900 text-white">
                    <div class="w-full max-w-sm">
                        <h1 class="text-2xl font-black mb-6 text-center">Entrar</h1>
                        <div class="space-y-4">
                            <input type="email" id="loginEmail" placeholder="E-mail" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 outline-none focus:ring-2 focus:ring-[#7aa2a1] text-white">
                            <input type="password" id="loginSenha" placeholder="Senha" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 outline-none focus:ring-2 focus:ring-[#7aa2a1] text-white">
                            <button onclick="handleLogin()" class="w-full py-3 bg-[#7aa2a1] rounded-xl font-bold hover:bg-[#688f8e] transition-colors">Entrar</button>
                        </div>
                        <p class="text-center text-sm text-gray-400 mt-4">Não tem conta? <a href="#" onclick="navigateTo('register')" class="text-[#7aa2a1] font-bold hover:underline">Cadastre-se</a></p>
                    </div>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900 text-white">
                    <div class="w-full max-w-sm">
                        <h1 class="text-2xl font-black mb-6 text-center">Criar Conta</h1>
                        <div class="space-y-4">
                            <input type="text" id="regNome" placeholder="Nome" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 outline-none focus:ring-2 focus:ring-[#7aa2a1] text-white">
                            <input type="email" id="regEmail" placeholder="E-mail" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 outline-none focus:ring-2 focus:ring-[#7aa2a1] text-white">
                            <input type="password" id="regSenha" placeholder="Senha" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 outline-none focus:ring-2 focus:ring-[#7aa2a1] text-white">
                            <button onclick="handleRegister()" class="w-full py-3 bg-[#7aa2a1] rounded-xl font-bold hover:bg-[#688f8e] transition-colors">Cadastrar</button>
                        </div>
                        <p class="text-center text-sm text-gray-400 mt-4">Já tem conta? <a href="#" onclick="navigateTo('login')" class="text-[#7aa2a1] font-bold hover:underline">Entrar</a></p>
                    </div>
                </div>
            `;
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            if (!email || !senha) return alert('Preencha todos os campos.');
            try {
                const data = await apiLogin(email, senha);
                App.user = data.user;
                App.view = 'dashboard';
                render();
            } catch (error) { alert(error.message); }
        }

        async function handleRegister() {
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;
            if (!nome || !email || !senha) return alert('Preencha todos os campos.');
            try {
                const data = await apiRegister({ nome, email, senha });
                App.user = data.user;
                App.view = 'dashboard';
                render();
            } catch (error) { alert(error.message); }
        }

        // ==========================================
        // DASHBOARD
        // ==========================================
        function renderDashboard() {
            return `
                <div class="flex-1 flex flex-col h-full bg-white dark:bg-slate-800">
                    <div class="flex items-center justify-between p-6 border-b dark:border-slate-700">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-[#7aa2a1] rounded-xl flex items-center justify-center">
                                <i class="fas fa-check-double text-white"></i>
                            </div>
                            <h1 class="text-xl font-black text-gray-800 dark:text-white">Automatic Correction</h1>
                        </div>
                        <button onclick="toggleSidebar()" class="text-gray-500 hover:text-black dark:hover:text-white p-2 bg-gray-100 dark:bg-slate-700 rounded-lg">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="p-6 flex-1 overflow-auto">
                        <h2 class="text-sm font-bold text-gray-500 uppercase mb-4">Menu Principal</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div onclick="navigateTo('salas')" class="bg-gray-50 dark:bg-slate-700 p-6 rounded-3xl border dark:border-slate-600 cursor-pointer hover:shadow-lg transition-all flex flex-col items-center text-center">
                                <i class="fas fa-users text-4xl text-[#7aa2a1] mb-3"></i>
                                <h3 class="font-bold text-gray-800 dark:text-white">Gestão de Salas</h3>
                                <p class="text-xs text-gray-500">Gerenciar turmas e alunos</p>
                            </div>
                            <div onclick="navigateTo('results')" class="bg-gray-50 dark:bg-slate-700 p-6 rounded-3xl border dark:border-slate-600 cursor-pointer hover:shadow-lg transition-all flex flex-col items-center text-center">
                                <i class="fas fa-magic text-4xl text-[#7aa2a1] mb-3"></i>
                                <h3 class="font-bold text-gray-800 dark:text-white">Correção Automática</h3>
                                <p class="text-xs text-gray-500">Corrigir provas com IA</p>
                            </div>
                            <div onclick="navigateTo('charts')" class="bg-gray-50 dark:bg-slate-700 p-6 rounded-3xl border dark:border-slate-600 cursor-pointer hover:shadow-lg transition-all flex flex-col items-center text-center">
                                <i class="fas fa-chart-pie text-4xl text-[#7aa2a1] mb-3"></i>
                                <h3 class="font-bold text-gray-800 dark:text-white">Gráficos</h3>
                                <p class="text-xs text-gray-500">Desempenho da turma</p>
                            </div>
                            <div onclick="navigateTo('compare')" class="bg-gray-50 dark:bg-slate-700 p-6 rounded-3xl border dark:border-slate-600 cursor-pointer hover:shadow-lg transition-all flex flex-col items-center text-center">
                                <i class="fas fa-columns text-4xl text-[#7aa2a1] mb-3"></i>
                                <h3 class="font-bold text-gray-800 dark:text-white">Comparar Provas</h3>
                                <p class="text-xs text-gray-500">Lado a lado</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // TELAS DE SALAS (A SEREM COMPLETADAS PELOS BLOCOS 3/4)
        // ==========================================
        function renderSalas() {
            return `
                ${renderSimpleHeader('Gestão de Salas')}
                <div class="p-6">
                    <p class="text-gray-500 text-center mt-10">A funcionalidade completa de Salas será carregada aqui.</p>
                    <button onclick="navigateTo('dashboard')" class="mt-4 w-full btn-secondary">Voltar</button>
                </div>
            `;
        }

        function renderSalaDetalhe() {
            return `
                ${renderSimpleHeader('Detalhes da Sala')}
                <div class="p-6 text-center text-gray-500">Carregando detalhes...</div>
            `;
        }

        function renderResults() {
            return `
                ${renderSimpleHeader('Correção Automática')}
                <div class="p-6 text-center text-gray-500">Tela de correção será carregada aqui.</div>
            `;
        }

        function renderCharts() { return renderSimpleHeader('Gráficos') + '<div class="p-6 text-center text-gray-500">Gráficos</div>'; }
        function renderCompare() { return renderSimpleHeader('Comparar Provas') + '<div class="p-6 text-center text-gray-500">Comparação</div>'; }
        function renderAplicarProva() { return renderSimpleHeader('Aplicar Prova') + '<div class="p-6 text-center text-gray-500">Aplicar Prova</div>'; }
        function renderProfile() { return renderSimpleHeader('Meu Perfil') + '<div class="p-6 text-center text-gray-500">Perfil</div>'; }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        window.onload = function() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            if (token && userStr) {
                try { App.user = JSON.parse(userStr); } catch(e) {}
                App.view = 'dashboard';
            } else {
                App.view = 'splash';
            }
            render();
        };
    </script>
</body>
</html>
