        <!-- ============================================================
    BLOCO 1: CONFIGURAÇÃO
    ============================================================ -->
    <script>
        // ============================================================
        // AMBIENTES
        // - development : máquina local (localhost/127.0.0.1)
        // - production  : Render (backend real)
        // - netlify     : frontend hospedado no Netlify (usa Render)
        // Obs.: o domínio próprio "automatic-correction.com" ainda
        // NÃO está ativo. Quando estiver, basta descomentar a linha
        // marcada com [DOMÍNIO PRÓPRIO] abaixo.
        // ============================================================
        const DOMAIN_CONFIG = {
            development: 'http://localhost:3000',
            render:      'https://automatic-correction-t5h6.onrender.com',
            netlify:     'https://automaticcorrection.netlify.app',
            // [DOMÍNIO PRÓPRIO] ative quando o DNS estiver configurado:
            // customDomain: 'https://automatic-correction.com'
        };

        const hostname = window.location.hostname;

        const isLocalhost =
            hostname === 'localhost' ||
            hostname === '127.0.0.1' ||
            hostname === '' ||
            hostname.startsWith('192.168.') ||
            hostname.startsWith('10.');

        // Detecta se está rodando dentro do Netlify (preview ou produção)
        const isNetlify = hostname.endsWith('.netlify.app');

        // Escolhe a URL base do backend
        let SITE_URL;
        let environmentLabel;

        if (isLocalhost) {
            SITE_URL = DOMAIN_CONFIG.development;
            environmentLabel = '💻 Desenvolvimento (localhost)';
        } else {
            // Produção: usa SEMPRE o Render (o domínio próprio ainda não está ativo)
            SITE_URL = DOMAIN_CONFIG.render;
            environmentLabel = isNetlify
                ? '🚀 Produção (Netlify → Render)'
                : '🌐 Produção (Render)';
        }

        // Remove barra final, se houver
        SITE_URL = SITE_URL.replace(/\/+$/, '');

        const API_URL = `${SITE_URL}/api`;

        const CONFIG = {
            SITE_URL:       SITE_URL,
            API_URL:        API_URL,
            RENDER_URL:     DOMAIN_CONFIG.render,
            NETLIFY_URL:    DOMAIN_CONFIG.netlify,
            APP_NAME:       'Automatic Correction',
            APP_DOMAIN:     'automatic-correction.com',
            GITHUB_URL:     'https://github.com/capic2024118isinf0082-arch/Automatic-Correction--A.C.-',
            VERSION:        '1.1.0',
            NOTA_MINIMA_APROVACAO: 6.0,
            isLocalhost:    isLocalhost,
            isNetlify:      isNetlify,
            isProduction:   !isLocalhost
        };

        // Expõe globalmente (evita "API_URL is not defined" em outros blocos)
        window.CONFIG      = CONFIG;
        window.API_URL     = API_URL;
        window.SITE_URL    = SITE_URL;

        console.log('%c🌐 AUTOMATIC CORRECTION', 'color:#7aa2a1;font-weight:bold;font-size:14px');
        console.log(`📦 Versão:     ${CONFIG.VERSION}`);
        console.log(`📡 Backend:    ${CONFIG.SITE_URL}`);
        console.log(`🔗 API:        ${CONFIG.API_URL}`);
        console.log(`🖥️  Frontend:   ${window.location.origin}`);
        console.log(`📂 Ambiente:   ${environmentLabel}`);
    </script>

    <!-- ============================================================
    BLOCO 2: VERIFICAÇÃO DO SERVIDOR
    ============================================================ -->
    <script>
        // Controla spam de log no console
        let _lastServerStatus = null;

        async function verificarServidor(silencioso) {
            const el = document.getElementById('statusServidor');
            if (!el) return false;

            try {
                // Timeout maior porque o Render gratuito "dorme" e
                // pode levar ~50s para acordar na primeira chamada.
                const controller = new AbortController();
                const timeoutId  = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`${CONFIG.API_URL}/health`, {
                    method:  'GET',
                    headers: { 'Accept': 'application/json' },
                    signal:  controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    el.innerHTML = '🟢 Servidor Online';
                    el.className = 'status-online';
                    if (_lastServerStatus !== 'online') {
                        console.log('✅ Backend online.');
                        _lastServerStatus = 'online';
                    }
                    return true;
                } else {
                    el.innerHTML = '🟡 Servidor com problema';
                    el.className = 'status-offline';
                    if (_lastServerStatus !== 'degraded') {
                        console.warn(`⚠️ Backend respondeu ${response.status}.`);
                        _lastServerStatus = 'degraded';
                    }
                    return false;
                }
            } catch (error) {
                el.innerHTML = '🔴 Servidor Offline';
                el.className = 'status-offline';

                if (!silencioso && _lastServerStatus !== 'offline') {
                    console.warn(
                        '⚠️ Backend não acessível. Se estiver no Render gratuito, ' +
                        'a primeira chamada pode levar ~50s para "acordar".',
                        error.message
                    );
                    _lastServerStatus = 'offline';
                }
                return false;
            }
        }

        // Cria o indicador de status (canto inferior esquerdo)
        if (!document.getElementById('statusServidor')) {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'statusServidor';
            statusDiv.innerHTML = '🔄 Verificando...';
            statusDiv.className = 'status-checking';
            document.body.appendChild(statusDiv);
        }

        // Verifica a cada 30s (era 10s — menos agressivo com o Render gratuito)
        setInterval(() => verificarServidor(true), 30000);

        // Primeira verificação após o carregamento
        setTimeout(() => verificarServidor(false), 800);
    </script>

        <!-- ============================================================
    BLOCO 3: API
    ============================================================ -->
    <script>
        window.API_URL = CONFIG.API_URL;

        function getToken() { return localStorage.getItem('token'); }

        function getHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        // ============================================================
        // AUTENTICAÇÃO
        // ============================================================
        async function apiLogin(email, senha) {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao fazer login');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no login:', error); throw error; }
        }

        async function apiRegister(dados) {
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: dados.nome,
                        sobrenome: dados.sobrenome,
                        email: dados.email,
                        senha: dados.senha,
                        biografia: dados.biografia || 'Docente',
                        escola: dados.escola || 'Escola'
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao registrar');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no registro:', error); throw error; }
        }

        async function apiGetProfile() {
            const response = await fetch(`${API_URL}/auth/profile`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar perfil');
            return data.user;
        }

        async function apiUpdateProfile(dados) {
            const response = await fetch(`${API_URL}/auth/profile`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar perfil');
            localStorage.setItem('user', JSON.stringify(data.user));
            return data.user;
        }

        // ============================================================
        // TURMAS
        // ============================================================
        async function apiListarTurmas(filtros = {}) {
            try {
                let url = `${API_URL}/turmas`;
                const params = new URLSearchParams();
                if (filtros.busca) params.append('busca', filtros.busca);
                if (filtros.status && filtros.status !== 'todos') params.append('status', filtros.status);
                if (filtros.nivel && filtros.nivel !== 'todos') params.append('nivel', filtros.nivel);
                if (filtros.ordenar) params.append('ordenar', filtros.ordenar);
                if (params.toString()) url += `?${params.toString()}`;

                const response = await fetch(url, { headers: getHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao listar turmas');
                return data;
            } catch (error) { console.error('❌ Erro ao listar turmas:', error); throw error; }
        }

        async function apiCriarTurma(dados) {
            try {
                const response = await fetch(`${API_URL}/turmas`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(dados)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao criar turma');
                return data.turma;
            } catch (error) { console.error('❌ Erro ao criar turma:', error); throw error; }
        }

        async function apiBuscarTurma(id) {
            try {
                const response = await fetch(`${API_URL}/turmas/${id}`, { headers: getHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || data.message || 'Erro ao buscar turma');
                return data;
            } catch (error) { console.error('❌ Erro ao buscar turma:', error); throw error; }
        }

        async function apiAtualizarTurma(id, dados) {
            const response = await fetch(`${API_URL}/turmas/${id}`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar turma');
            return data.turma;
        }

        async function apiDeletarTurma(id) {
            const response = await fetch(`${API_URL}/turmas/${id}`, {
                method: 'DELETE',
                headers: getHeaders()
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao deletar turma');
            return data;
        }

        async function apiDuplicarTurma(id) {
            const response = await fetch(`${API_URL}/turmas/${id}/duplicar`, {
                method: 'POST',
                headers: getHeaders()
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao duplicar turma');
            return data.turma;
        }

        async function deletarTurma(id) {
            if (!confirm('Tem certeza que deseja EXCLUIR esta turma? Todos os alunos e notas serão perdidos. Esta ação não pode ser desfeita.')) {
                return;
            }
            
            try {
                await apiDeletarTurma(id);
                App.mensagemToast = 'Turma excluída com sucesso!';
                App.showSyncSuccess = true;
                // Recarrega a lista de turmas
                if (typeof carregarTurmas === 'function') await carregarTurmas();
                navigateTo('salas');
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) {
                App.mensagemErro = 'Erro ao excluir turma: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(function() { App.showSyncError = false; render(); }, 4000);
            }
        }

        async function deletarAluno(id, turmaId) {
            if (!confirm('Tem certeza que deseja remover este aluno da turma?')) {
                return;
            }

            try {
                await apiRemoverAluno(id);
                App.mensagemToast = 'Aluno removido com sucesso!';
                App.showSyncSuccess = true;
                // Recarrega os detalhes da turma
                if (typeof selectClass === 'function') await selectClass(turmaId);
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) {
                App.mensagemErro = 'Erro ao remover aluno: ' + error.message;
                App.showSyncError = true;
                render();
                setTimeout(function() { App.showSyncError = false; render(); }, 4000);
            }
        }

        // ============================================================
        // TURMAS — REGISTRAR AULA (persistente)
        // ============================================================
        // Incrementa total_aulas da turma no backend.
        // Tenta primeiro enviar apenas { total_aulas }.
        // Se o backend exigir o objeto completo (400), cai para
        // apiAtualizarTurma com todos os campos.
        async function apiRegistrarAula(turmaId, totalAulasAtual, turmaCompleta) {
            const novoTotal = (parseInt(totalAulasAtual, 10) || 0) + 1;

            // Tentativa 1 — payload mínimo
            try {
                const response = await fetch(`${API_URL}/turmas/${turmaId}`, {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ total_aulas: novoTotal })
                });

                if (response.ok) {
                    const data = await response.json().catch(() => ({}));
                    return { total_aulas: novoTotal, turma: data.turma || null };
                }

                // 400/422 → backend exige mais campos; tenta fallback
                if (response.status !== 400 && response.status !== 422) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || 'Erro ao registrar aula');

        // ============================================================

        // ============================================================
        function processarArquivoImagem(file, callback) {
            if (!file) return;

            const tiposValidos = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
            if (!tiposValidos.includes(file.type) && !file.type.startsWith('image/')) {
                alert('Formato de arquivo não suportado. Use JPG, PNG, GIF, WEBP ou PDF.');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('Arquivo muito grande. Máximo 10MB.');
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function() {
                callback({
                    dataUrl: reader.result,
                    mimeType: file.type,
                    base64: reader.result.split(',')[1],
                    name: file.name,
                    size: file.size
                });
            };
            reader.onerror = function() {
                alert('Erro ao ler o arquivo. Tente novamente.');
            };
            reader.readAsDataURL(file);
        }

        function tirarFoto(callback) {
            if ('mediaDevices' in navigator && navigator.mediaDevices.getUserMedia) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.onchange = function(e) {
                    if (e.target.files && e.target.files[0]) {
                        processarArquivoImagem(e.target.files[0], callback);
                    }
                };
                input.click();
            } else {
                alert('Seu dispositivo não suporta câmera. Use a opção "Carregar".');
            }
        }

        async function selecionarTurmaParaCorrecao(turmaId) {
            App.selectedTargetClass = turmaId;
            App.selectedTargetStudent = '';
            
            if (!turmaId) {
                render();
                return;
            }

            // Se já temos em cache, só renderiza
            if (App.alunosPorTurma[turmaId] && App.alunosPorTurma[turmaId].length > 0) {
                render();
                return;
            }

            try {
                const alunos = await apiListarAlunos(turmaId);
                App.alunosPorTurma[turmaId] = (alunos || []).map(function(a) {
                    return {
                        id: a.id,
                        number: a.numero,
                        name: a.nome,
                        gpa: a.gpa || 0
                    };
                });
                render();
            } catch (error) {
                console.warn('Erro ao carregar alunos da turma:', error);
                App.alunosPorTurma[turmaId] = [];
                render();
            }
        }

        async function handleAiCorrection() {
            if (!App.officialGabarito) {
                App.errorMsg = 'ERRO: Carregue primeiro o Gabarito Oficial do Professor.';
                render();
                return;
            }
            if (!App.studentGabarito) {
                App.errorMsg = 'ERRO: Digitalize ou carregue a prova do Aluno.';
                render();
                return;
            }

            App.isCorrecting = true;
            App.errorMsg = '';
            render();

            // ---------------------------------------------------------
            // MODO SIMULAÇÃO
            // ---------------------------------------------------------
            if (App.simulationMode) {
                await new Promise(function(resolve) { setTimeout(resolve, 1500); });
                
                const grade = (Math.random() * 4 + 6); // Simula nota entre 6 e 10
                const correctCount = Math.floor(Math.random() * 10) + 10;
                
                App.ultimaCorrecao = {
                    studentName: 'Aluno (Simulação)',
                    grade: parseFloat(grade.toFixed(1)),
                    correctCount: correctCount,
                    wrongCount: 20 - correctCount,
                    mainDifficulty: 'Interpretação de Texto',
                    tipsList: [
                        { title: 'Revisão de Conteúdo', desc: 'Praticar mais exercícios de interpretação textual.' },
                        { title: 'Exercícios Complementares', desc: 'Resolver questões de provas anteriores.' }
                    ],
                    simulado: true
                };
                
                App.lastCorrectionData = App.ultimaCorrecao;
                App.isCorrecting = false;
                App.mensagemToast = 'SIMULAÇÃO: Nota ' + grade.toFixed(1) + ' (não salva no banco)';
                App.showSyncSuccess = true;
                render();
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 4000);
                return;
            }

            // ---------------------------------------------------------
            // MODO REAL (Chama a API)
            // ---------------------------------------------------------
            try {
                const response = await apiCorrigirProva({
                    gabaritoOficial: App.officialGabarito, 
                    provaAluno: App.studentGabarito,       
                    turmaId: App.selectedTargetClass || null,
                    alunoId: App.selectedTargetStudent || null,
                    gabaritoTipo: 'image'
                });

                App.ultimaCorrecao = {
                    studentName: 'Aluno Corrigido',
                    grade: response.nota || 0,
                    correctCount: response.acertos || 0,
                    wrongCount: response.erros || 0,
                    mainDifficulty: response.dificuldade_principal || '-',
                    tipsList: response.dicas || [],
                    simulado: false
                };
                
                App.lastCorrectionData = App.ultimaCorrecao;
                App.mensagemToast = 'Correção realizada com sucesso!';
                App.showSyncSuccess = true;

            } catch (error) {
                console.error('Erro na correção:', error);
                
                if (typeof isEndpointIndisponivel === 'function' && isEndpointIndisponivel(error)) {
                    App.errorMsg = 'O endpoint de correção por IA ainda não foi implementado no backend. Ative o "Modo Simulação" para testar o fluxo visual.';
                } else {
                    App.errorMsg = 'Erro ao conectar com o servidor: ' + error.message;
                }
            } finally {
                App.isCorrecting = false;
                render();
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
            }
        }

        function renderNovaTurma() {
            var tab = App.activeTab || 'config';
            var configHtml = '<div class="space-y-6"><div class="bg-gray-50 dark:bg-slate-700 p-6 rounded-2xl border dark:border-slate-600"><h3 class="text-sm font-black text-gray-700 dark:text-gray-200 mb-4">Configurações</h3><div class="space-y-4"><div><label class="text-xs font-bold text-gray-500 mb-1.5 block">Nome</label><input type="text" class="input-style" value="' + App.novaTurma.nome + '" onchange="App.novaTurma.nome=this.value" placeholder="Ex: 9° Ano B" /></div><div><label class="text-xs font-bold text-gray-500 mb-1.5 block">Nível</label><select class="input-style appearance-none" onchange="App.novaTurma.nivel=this.value"><option value="Ensino Básico" ' + (App.novaTurma.nivel === 'Ensino Básico' ? 'selected' : '') + '>Ensino Básico</option><option value="Ensino Secundário" ' + (App.novaTurma.nivel === 'Ensino Secundário' ? 'selected' : '') + '>Ensino Secundário</option></select></div><div><label class="text-xs font-bold text-gray-500 mb-1.5 block">Status</label><select class="input-style appearance-none" onchange="App.novaTurma.status=this.value"><option value="success" ' + (App.novaTurma.status === 'success' ? 'selected' : '') + '>Excelente</option><option value="warning" ' + (App.novaTurma.status === 'warning' ? 'selected' : '') + '>Atenção</option><option value="danger" ' + (App.novaTurma.status === 'danger' ? 'selected' : '') + '>Crítico</option></select></div></div></div></div>';
            var alunosHtml = '<div class="space-y-6"><div class="bg-gray-50 dark:bg-slate-700 p-6 rounded-2xl border dark:border-slate-600"><h3 class="text-sm font-black text-gray-700 dark:text-gray-200 mb-4 flex items-center justify-between"><span>Alunos</span><button onclick="adicionarAluno()" class="btn-success text-xs">+ Adicionar</button></h3>';
            if (App.novaTurma.alunos && App.novaTurma.alunos.length > 0) {
                alunosHtml += '<div class="space-y-3 max-h-96 overflow-y-auto scrollbar-hide">';
                for (var ai = 0; ai < App.novaTurma.alunos.length; ai++) {
                    var aluno = App.novaTurma.alunos[ai];
                    alunosHtml += '<div class="student-card flex items-center justify-between gap-4"><div class="flex items-center gap-3"><div class="student-avatar-placeholder">' + getInitials(aluno.name) + '</div><div><p class="font-bold text-gray-800 dark:text-white text-sm">' + aluno.name + '</p></div></div><div class="flex gap-2"><button onclick="removerAluno(\'' + aluno.id + '\')" class="btn-danger text-xs py-1 px-3">Remover</button></div></div>';
                }
                alunosHtml += '</div>';
            } else { alunosHtml += '<div class="empty-state"><i class="fas fa-user-plus"></i><h3>Nenhum aluno</h3></div>'; }
            alunosHtml += '</div></div>';
            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full"><div class="flex items-center justify-between p-6 border-b border-gray-100 dark:border-slate-700"><button onclick="navigateTo(\'salas\')" class="text-gray-400 hover:text-black"><i class="fas fa-arrow-left text-2xl"></i></button><h2 class="text-lg font-black text-gray-700 dark:text-slate-100">Nova Turma</h2><div class="w-6"></div></div><div class="p-6 flex-1 overflow-y-auto"><div class="flex gap-2 mb-6 border-b dark:border-slate-700 pb-4"><button class="tab-button ' + (tab === 'config' ? 'active' : '') + '" onclick="App.activeTab=\'config\';render();"><i class="fas fa-cog"></i> Configurações</button><button class="tab-button ' + (tab === 'alunos' ? 'active' : '') + '" onclick="App.activeTab=\'alunos\';render();"><i class="fas fa-users"></i> Alunos</button></div>' + (tab === 'config' ? configHtml : alunosHtml) + '<div class="mt-6 flex gap-4"><button onclick="salvarTurma()" class="flex-1 btn-solid">💾 Salvar Turma</button><button onclick="cancelarTurma()" class="flex-1 btn-secondary">Cancelar</button></div></div></div>';
        }

        function adicionarAluno() { App.novaTurma.alunos.push({ id: generateId(), number: (App.novaTurma.alunos || []).length + 1, name: 'Aluno ' + ((App.novaTurma.alunos || []).length + 1), gpa: 0 }); render(); }
        function removerAluno(id) { App.novaTurma.alunos = App.novaTurma.alunos.filter(function(a) { return a.id !== id; }); render(); }
        async function salvarTurma() {
            if (!App.novaTurma.nome.trim()) { alert('Insira um nome.'); return; }
            try {
                var turma = await apiCriarTurma({ nome: App.novaTurma.nome, nivel: App.novaTurma.nivel, status: App.novaTurma.status });
                for (var i = 0; i < App.novaTurma.alunos.length; i++) { await apiAdicionarAluno({ turma_id: turma.id, numero: App.novaTurma.alunos[i].number, nome: App.novaTurma.alunos[i].name }); }
                App.novaTurma = { nome: '', nivel: 'Ensino Básico', status: 'success', alunos: [] };
                await carregarTurmas(); navigateTo('salas');
            } catch (error) { alert('Erro: ' + error.message); }
        }
        function cancelarTurma() { App.novaTurma = { nome: '', nivel: 'Ensino Básico', status: 'success', alunos: [] }; navigateTo('salas'); }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AUTOMATIC CORRECTION - Inicializando...');
            setTimeout(verificarServidor, 1000);
            var token = localStorage.getItem('token'); var user = localStorage.getItem('user');
            if (token && user) {
                try {
                    App.user = JSON.parse(user); App.profileName = App.user.nome || 'Professor'; App.profileEmail = App.user.email || ''; App.profileBio = App.user.biografia || 'Docente';
                    carregarTurmas().then(function() { navigateTo('dashboard'); });
                } catch (e) { localStorage.removeItem('token'); localStorage.removeItem('user'); navigateTo('login'); }
            } else { navigateTo('splash'); }
        });
        // ===================================================================================
        // PARTE 4 - TELAS DE GRÁFICOS, COMPARAÇÃO E APLICAR PROVA
        // ===================================================================================

        function renderCharts() {
            var cls = App.selectedClass;
            if (!cls) return '<div class="p-6 text-center text-gray-500">Nenhuma turma selecionada.</div>';

            var stats = cls.statistics || { mediaTurma: 0, aprovados: 0, reprovados: 0, averageAttendance: '0%', heatmap: {} };
            var students = cls.students || [];
            
            // Calcula o máximo para escala dos gráficos de barra (evita divisão por zero)
            var maxMedia = 10; 
            var totalAlunos = students.length || 1;

            // Monta o HTML do Heatmap (Habilidades)
            var heatmapHtml = '';
            var heatmapKeys = Object.keys(stats.heatmap || {});
            if (heatmapKeys.length === 0) {
                heatmapHtml = '<p class="text-sm text-gray-500">Sem dados de habilidades suficientes.</p>';
            } else {
                heatmapKeys.forEach(function(key) {
                    var val = stats.heatmap[key] || 0;
                    // Cor baseada no valor (0-100)
                    var colorClass = val >= 80 ? 'bg-green-500' : val >= 60 ? 'bg-yellow-400' : val >= 40 ? 'bg-orange-400' : 'bg-red-500';
                    heatmapHtml += '<div class="mb-3">' +
                        '<div class="flex justify-between text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">' +
                        '<span>' + key + '</span><span>' + val + '%</span></div>' +
                        '<div class="w-full bg-gray-200 dark:bg-slate-600 rounded-full h-2.5">' +
                        '<div class="' + colorClass + ' h-2.5 rounded-full" style="width: ' + val + '%"></div>' +
                        '</div></div>';
                });
            }

            // Monta o HTML de distribuição de notas (Aprovados vs Reprovados)
            var aprovadosPct = totalAlunos > 0 ? Math.round((stats.aprovados / totalAlunos) * 100) : 0;
            var reprovadosPct = totalAlunos > 0 ? Math.round((stats.reprovados / totalAlunos) * 100) : 0;

            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full">' +
                '<div class="p-6 border-b border-gray-100 dark:border-slate-700">' +
                '<h2 class="text-xl font-black text-gray-800 dark:text-white"><i class="fas fa-chart-pie text-[#7aa2a1]"></i> Desempenho da Turma</h2>' +
                '<p class="text-sm text-gray-500">' + cls.name + '</p></div>' +
                
                '<div class="p-6 flex-1 overflow-auto space-y-8">' +
                
                // 1. Cards de Resumo
                '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl border dark:border-slate-600 text-center"><p class="text-xs text-gray-500 font-bold uppercase">Média Geral</p><p class="text-3xl font-black text-[#7aa2a1]">' + stats.mediaTurma + '</p></div>' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl border dark:border-slate-600 text-center"><p class="text-xs text-gray-500 font-bold uppercase">Presença</p><p class="text-3xl font-black text-[#7aa2a1]">' + stats.averageAttendance + '</p></div>' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl border dark:border-slate-600 text-center"><p class="text-xs text-gray-500 font-bold uppercase">Aprovados</p><p class="text-3xl font-black text-green-500">' + stats.aprovados + '</p></div>' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl border dark:border-slate-600 text-center"><p class="text-xs text-gray-500 font-bold uppercase">Reprovados</p><p class="text-3xl font-black text-red-500">' + stats.reprovados + '</p></div>' +
                '</div>' +

                // 2. Heatmap de Habilidades
                '<div class="bg-white dark:bg-slate-700 border dark:border-slate-600 rounded-3xl p-6 shadow-sm">' +
                '<h3 class="font-bold text-gray-800 dark:text-white mb-4"><i class="fas fa-fire text-orange-500"></i> Domínio por Habilidade</h3>' +
                heatmapHtml +
                '</div>' +

                // 3. Gráfico de Aprovação (Barras Horizontais)
                '<div class="bg-white dark:bg-slate-700 border dark:border-slate-600 rounded-3xl p-6 shadow-sm">' +
                '<h3 class="font-bold text-gray-800 dark:text-white mb-4"><i class="fas fa-check-circle text-green-500"></i> Status dos Alunos</h3>' +
                '<div class="flex items-center gap-4 mb-2"><span class="w-24 text-xs font-bold text-gray-500">Aprovados</span>' +
                '<div class="flex-1 bg-gray-100 dark:bg-slate-600 rounded-full h-4"><div class="bg-green-500 h-4 rounded-full" style="width: ' + aprovadosPct + '%"></div></div>' +
                '<span class="text-xs font-bold w-10 text-right">' + aprovadosPct + '%</span></div>' +
                '<div class="flex items-center gap-4"><span class="w-24 text-xs font-bold text-gray-500">Reprovados</span>' +
                '<div class="flex-1 bg-gray-100 dark:bg-slate-600 rounded-full h-4"><div class="bg-red-500 h-4 rounded-full" style="width: ' + reprovadosPct + '%"></div></div>' +
                '<span class="text-xs font-bold w-10 text-right">' + reprovadosPct + '%</span></div>' +
                '</div>' +

                '<div class="flex justify-center pt-4">' +
                '<button onclick="navigateTo(\'sala_detalhe\')" class="btn-secondary px-6 py-2"><i class="fas fa-arrow-left"></i> Voltar para a Turma</button>' +
                '</div>' +
                '</div></div>';
        }

        function renderCompare() {
            var hasOfficial = App.officialGabarito != null;
            var hasStudent = App.studentGabarito != null;
            var correction = App.ultimaCorrecao || App.lastCorrectionData;

            var oficialHtml = hasOfficial ? 
                `<img src="${App.officialGabarito}" class="max-h-64 mx-auto object-contain rounded border border-gray-200" alt="Gabarito Oficial">` : 
                `<div class="h-64 flex flex-col items-center justify-center bg-gray-50 rounded border border-dashed border-gray-300 text-gray-400"><i class="fas fa-file-image text-4xl mb-2"></i><p class="text-sm">Nenhum gabarito carregado</p></div>`;

            var alunoHtml = hasStudent ? 
                `<img src="${App.studentGabarito}" class="max-h-64 mx-auto object-contain rounded border border-gray-200" alt="Prova do Aluno">` : 
                `<div class="h-64 flex flex-col items-center justify-center bg-gray-50 rounded border border-dashed border-gray-300 text-gray-400"><i class="fas fa-camera text-4xl mb-2"></i><p class="text-sm">Nenhuma prova digitalizada</p></div>`;

            var resultadoHtml = '';
            if (correction) {
                var badge = correction.simulado ? '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-1 rounded uppercase">Simulação</span>' : '';
                resultadoHtml = `
                    <div class="mt-6 bg-white dark:bg-slate-700 border dark:border-slate-600 rounded-3xl p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-gray-800 dark:text-white"><i class="fas fa-clipboard-check text-[#7aa2a1]"></i> Resultado da Correção</h3>
                            ${badge}
                        </div>
                        <div class="flex items-center gap-6 mb-4">
                            <div class="text-center">
                                <p class="text-4xl font-black text-[#7aa2a1]">${correction.grade}</p>
                                <p class="text-xs text-gray-500 font-bold uppercase">Nota</p>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm text-gray-600 dark:text-gray-300"><strong>Acertos:</strong> ${correction.correctCount} | <strong>Erros:</strong> ${correction.wrongCount}</p>
                                <p class="text-sm text-gray-600 dark:text-gray-300 mt-1"><strong>Maior dificuldade:</strong> ${correction.mainDifficulty}</p>
                            </div>
                        </div>
                        ${correction.tipsList && correction.tipsList.length > 0 ? `
                            <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl mt-4">
                                <p class="text-xs font-bold text-blue-800 dark:text-blue-300 uppercase mb-2">Recomendações de Estudo:</p>
                                <ul class="list-disc list-inside text-sm text-blue-700 dark:text-blue-400">
                                    ${correction.tipsList.map(t => `<li><strong>${t.title}:</strong> ${t.desc}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                `;
            } else {
                resultadoHtml = `
                    <div class="mt-6 text-center p-6 bg-gray-50 dark:bg-slate-700 rounded-3xl border border-dashed border-gray-300 dark:border-slate-600">
                        <i class="fas fa-info-circle text-gray-400 text-2xl mb-2"></i>
                        <p class="text-sm text-gray-500">Nenhuma correção realizada ainda. Vá para a tela de Correção Automática para iniciar.</p>
                        <button onclick="navigateTo('results')" class="mt-3 text-[#7aa2a1] font-bold text-sm hover:underline">Ir para Correção Automática</button>
                    </div>
                `;
            }

            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-5xl mx-auto w-full">' +
                '<div class="p-6 border-b border-gray-100 dark:border-slate-700">' +
                '<h2 class="text-xl font-black text-gray-800 dark:text-white"><i class="fas fa-columns text-[#7aa2a1]"></i> Comparar Provas</h2>' +
                '<p class="text-sm text-gray-500">Veja lado a lado o gabarito oficial e a prova do aluno.</p></div>' +
                
                '<div class="p-6 flex-1 overflow-auto">' +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl"><h3 class="text-sm font-bold text-gray-700 dark:text-gray-200 mb-3 uppercase text-center">Gabarito Oficial</h3>' + oficialHtml + '</div>' +
                '<div class="bg-gray-50 dark:bg-slate-700 p-4 rounded-2xl"><h3 class="text-sm font-bold text-gray-700 dark:text-gray-200 mb-3 uppercase text-center">Prova do Aluno</h3>' + alunoHtml + '</div>' +
                '</div>' +
                resultadoHtml +
                '<div class="flex justify-center mt-8">' +
                '<button onclick="navigateTo(\'results\')" class="btn-secondary px-6 py-2"><i class="fas fa-arrow-left"></i> Voltar</button>' +
                '</div></div></div>';
        }

        function renderAplicarProva() {
            // Estrutura preparada para o endpoint POST /provas
            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">' +
                '<div class="p-6 border-b border-gray-100 dark:border-slate-700">' +
                '<h2 class="text-xl font-black text-gray-800 dark:text-white"><i class="fas fa-file-signature text-[#7aa2a1]"></i> Aplicar Prova Digital</h2>' +
                '<p class="text-sm text-gray-500">Crie uma nova avaliação para uma turma.</p></div>' +
                
                '<div class="p-6 flex-1 overflow-auto">' +
                '<div class="bg-white dark:bg-slate-700 border dark:border-slate-600 rounded-3xl p-6 shadow-sm mb-6">' +
                '<div class="space-y-4">' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1 block">Título da Prova</label>' +
                '<input type="text" id="provaTitulo" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1]" placeholder="Ex: Prova Bimestral de Matemática"></div>' +
                
                '<div><label class="text-xs font-bold text-gray-500 mb-1 block">Turma Destino</label>' +
                '<select id="provaTurma" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border dark:border-slate-600 rounded-xl outline-none">' +
                '<option value="">Selecione a turma...</option>' +
                App.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('') +
                '</select></div>' +

                '<div class="grid grid-cols-2 gap-4">' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1 block">Disciplina</label>' +
                '<input type="text" id="provaDisciplina" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border dark:border-slate-600 rounded-xl outline-none" placeholder="Ex: Matemática"></div>' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1 block">Nº de Questões</label>' +
                '<input type="number" id="provaQtd" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border dark:border-slate-600 rounded-xl outline-none" value="10" min="1"></div>' +
                '</div>' +

                '<div><label class="text-xs font-bold text-gray-500 mb-1 block">Data de Aplicação</label>' +
                '<input type="date" id="provaData" class="w-full p-3 bg-gray-50 dark:bg-slate-800 border dark:border-slate-600 rounded-xl outline-none"></div>' +
                '</div></div>' +

                '<div class="flex justify-end gap-3">' +
                '<button onclick="navigateTo(\'dashboard\')" class="btn-secondary px-6 py-2">Cancelar</button>' +
                '<button onclick="handleAplicarProva()" class="btn-solid bg-[#7aa2a1] hover:bg-[#688f8e] px-6 py-2"><i class="fas fa-paper-plane"></i> Criar e Aplicar</button>' +
                '</div>' +
                '</div></div>';
        }

        // Função auxiliar que será chamada pelo botão "Criar e Aplicar"
        async function handleAplicarProva() {
            var titulo = document.getElementById('provaTitulo').value;
            var turmaId = document.getElementById('provaTurma').value;
            var disciplina = document.getElementById('provaDisciplina').value;
            var totalQuestoes = document.getElementById('provaQtd').value;
            var dataAplicacao = document.getElementById('provaData').value;

            if (!titulo || !turmaId) {
                alert('Por favor, preencha o título e selecione a turma.');
                return;
            }

            try {
                // Chama a API (que vai falhar graciosamente se o endpoint não existir)
                await apiAplicarProva({
                    titulo: titulo,
                    turmaId: turmaId,
                    disciplina: disciplina || null,
                    totalQuestoes: parseInt(totalQuestoes, 10),
                    dataAplicacao: dataAplicacao || new Date().toISOString()
                });

                App.mensagemToast = 'Prova aplicada com sucesso!';
                App.showSyncSuccess = true;
                navigateTo('dashboard');
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);

            } catch (error) {
                console.error('Erro ao aplicar prova:', error);
                
                // Verifica se o erro é porque o endpoint não existe no backend
                if (typeof isEndpointIndisponivel === 'function' && isEndpointIndisponivel(error)) {
                    App.mensagemErro = 'O recurso de "Aplicar Prova Digital" ainda está em desenvolvimento no servidor. Em breve estará disponível!';
                } else {
                    App.mensagemErro = 'Erro ao aplicar prova: ' + error.message;
                }
                App.showSyncError = true;
                render();
                setTimeout(function() { App.showSyncError = false; render(); }, 5000);
            }
        }
    </script>
</body>
</html>
