    <!-- ============================================================
    BLOCO 2: VERIFICAÇÃO DO SERVIDOR
    ============================================================ -->
    <script>
        async function verificarServidor() {
            const el = document.getElementById('statusServidor');
            if (!el) return;
            
            try {
                const response = await fetch(`${CONFIG.CONFIG.API_URL}/health`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: AbortSignal.timeout(8000)
                });
                
                if (response.ok) {
                    el.innerHTML = '🟢 Servidor Online';
                    el.className = 'status-online';
                    return true;
                } else {
                    el.innerHTML = '🟡 Servidor com problema';
                    el.className = 'status-offline';
                    return false;
                }
            } catch (error) {
                el.innerHTML = '🔴 Servidor Offline';
                el.className = 'status-offline';
                console.warn('⚠️ Servidor não acessível:', error.message);
                return false;
            }
        }

        if (!document.getElementById('statusServidor')) {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'statusServidor';
            statusDiv.innerHTML = '🔄 Verificando...';
            statusDiv.className = 'status-checking';
            document.body.appendChild(statusDiv);
        }

        setInterval(verificarServidor, 15000);
        setTimeout(verificarServidor, 1000);
    </script>

    <script>
        function getToken() { return localStorage.getItem('token'); }

        function getHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        // ============================================================
        // AUTENTICAÇÃO
        // ============================================================
        async function apiLogin(email, senha) {
            try {
                const response = await fetch(`${CONFIG.CONFIG.API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao fazer login');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no login:', error); throw error; }
        }

        async function apiRegister(dados) {
            try {
                const response = await fetch(`${CONFIG.API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: dados.nome,
                        sobrenome: dados.sobrenome,
                        email: dados.email,
                        senha: dados.senha,
                        biografia: dados.biografia || 'Docente',
                        escola: dados.escola || 'Escola'
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao registrar');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                return data;
            } catch (error) { console.error('❌ Erro no registro:', error); throw error; }
        }

        async function apiGetProfile() {
            const response = await fetch(`${CONFIG.API_URL}/auth/profile`, { headers: getHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao buscar perfil');
            return data.user;
        }

        async function apiUpdateProfile(dados) {
            const response = await fetch(`${CONFIG.API_URL}/auth/profile`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify(dados)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar perfil');
            localStorage.setItem('user', JSON.stringify(data.user));
            return data.user;
        }

        // ============================================================
        // TURMAS
        // ============================================================
        async function apiListarTurmas(filtros = {}) {
            try {
                let url = `${CONFIG.API_URL}/turmas`;
                const params = new URLSearchParams();
                if (filtros.busca) params.append('busca', filtros.busca);
                if (filtros.status && filtros.status !== 'todos') params.append('status', filtros.status);
                if (filtros.nivel && filtros.nivel !== 'todos') params.append('nivel', filtros.nivel);
                if (filtros.ordenar) params.append('ordenar', filtros.ordenar);
                if (params.toString()) url += `?${params.toString()}`;
                
                const response = await fetch(url, { headers: getHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao listar turmas');
                return data;
            } catch (error) { console.error('❌ Erro ao listar turmas:', error); throw error; }
        }

        async function apiCriarTurma(dados) {
            try {
                const response = await fetch(`${CONFIG.API_URL}/turmas`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(dados)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro ao criar turma');
                return data.turma;
            } catch (error) { console.error('❌ Erro ao criar turma:', error); throw error; }
        }

        async function apiBuscarTurma(id) {
            try {
                const response = await fetch(`${CONFIG.API_URL}/turmas/${id}`, { headers: getHeaders() });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || data.message || 'Erro ao buscar turma');
                return data;
            } catch (error) { console.error('❌ Erro ao buscar turma:', error); throw error; }
        }

        async function apiAtualizarTurma(id, dados) {
            const response = await fetch(`${CONFIG.API_URL}/turmas/${id}`, {

                headers: getHeaders(),
                body: JSON.stringify(dados)

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro ao atualizar turma');
            return data.turma;

        // ============================================================
        // UPLOAD DE IMAGENS
        // ============================================================
        function processarArquivoImagem(file, callback) {
            if (!file) return;
            
            const tiposValidos = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
            if (!tiposValidos.includes(file.type) && !file.type.startsWith('image/')) {
                alert('Formato de arquivo não suportado. Use JPG, PNG, GIF, WEBP ou PDF.');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('Arquivo muito grande. Máximo 10MB.');
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function() {
                callback({
                    dataUrl: reader.result,
                    mimeType: file.type,
                    base64: reader.result.split(',')[1],
                    name: file.name,
                    size: file.size
                });
            };
            reader.onerror = function() {
                alert('Erro ao ler o arquivo. Tente novamente.');
            };
            reader.readAsDataURL(file);
        }

        function tirarFoto(callback) {
            if ('mediaDevices' in navigator && navigator.mediaDevices.getUserMedia) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'environment';
                input.onchange = function(e) {
                    if (e.target.files && e.target.files[0]) {
                        processarArquivoImagem(e.target.files[0], callback);
                    }
                };
                input.click();
            } else {
                alert('Seu dispositivo não suporta câmera. Use a opção "Carregar".');
            }
        }
    </script>

        // ============================================================

        function generateId() {
            return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        function getInitials(name) {
            if (!name) return '?';
            var parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        function getStatusClass(gpa) {
            if (gpa >= 8.0) return 'otimo';
            if (gpa >= 6.0) return 'bom';
            if (gpa >= 4.0) return 'regular';
            return 'ruim';
        }

        function getStatusIcon(gpa) {
            if (gpa >= 8.0) return 'fa-star';
            if (gpa >= 6.0) return 'fa-check-circle';
            if (gpa >= 4.0) return 'fa-exclamation-triangle';
            return 'fa-times-circle';
        }

        function getStatusLabel(gpa) {
            if (gpa >= 8.0) return 'Ótimo';
            if (gpa >= 6.0) return 'Bom';
            if (gpa >= 4.0) return 'Regular';
            return 'Ruim';
        }

        function getGradeColor(gpa) {
            if (gpa >= 8.0) return 'text-green-500';
            if (gpa >= 6.0) return 'text-blue-500';
            if (gpa >= 4.0) return 'text-yellow-500';
            return 'text-red-500';
        }

        function getStatusColor(status) {
            if (status === 'success') return 'bg-green-500';
            if (status === 'warning') return 'bg-yellow-500';
            return 'bg-red-500';
        }

        function getRandomDetails(count) {
            var details = [];
            for (var i = 0; i < count; i++) {
                details.push(Math.random() > 0.3 ? 1 : 0);
            }
            return details;
        }

        function getStatusLabelFromStatus(status) {
            if (status === 'success') return 'Excelente';
            if (status === 'warning') return 'Atenção';
            return 'Crítico';
        }

        function calcularPresencaAluno(student, totalAulas) {
            if (!student || totalAulas === 0) return 0;
            var presencas = student.presencas || 0;
            return Math.round((presencas / totalAulas) * 100);
        }

        function getPresencaClass(percentual) {
            if (percentual >= 75) return 'alta';
            if (percentual >= 50) return 'media';
            return 'baixa';
        }

        function updateStudentStats(student) {
            var history = student.history || [];
            var total = history.length;
            if (total === 0) {
                student.gpa = 0; student.lastGrade = 0; student.testCount = 0;
                student.successRate = 0; student.trend = 'up'; student.status = 'regular';
                return student;
            }
            var sum = 0, successSum = 0;
            var last = history[history.length - 1] || { grade: 0 };
            for (var i = 0; i < history.length; i++) {
                sum += history[i].grade || 0;
                var totalQ = (history[i].correct || 0) + (history[i].wrong || 0);
                if (totalQ > 0) successSum += ((history[i].correct || 0) / totalQ) * 100;
            }
            student.gpa = parseFloat((sum / total).toFixed(1));
            student.lastGrade = last.grade || 0;
            student.testCount = total;
            student.successRate = Math.round(successSum / total);
            student.trend = 'up';
            if (history.length >= 2) {
                var lastTwo = history.slice(-2);
                if (lastTwo[1].grade < lastTwo[0].grade) student.trend = 'down';
            }
            student.status = getStatusClass(student.gpa);
            return student;
        }

        function getSortedStudents(list) {
            var result = (list || []).slice();
            var filter = App.activeFilter;
            var search = App.searchQuery.toLowerCase();

            if (filter === 'aprovados') result = result.filter(function(s) { return s.gpa >= CONFIG.NOTA_MINIMA_APROVACAO; });
            else if (filter === 'recuperacao') result = result.filter(function(s) { return s.gpa < CONFIG.NOTA_MINIMA_APROVACAO; });

            if (search) result = result.filter(function(s) { return s.name.toLowerCase().indexOf(search) !== -1; });

            switch (App.activeSort) {
                case 'alfabetica': return result.sort(function(a, b) { return a.name.localeCompare(b.name); });
                case 'melhor-desempenho': return result.sort(function(a, b) { return b.gpa - a.gpa; });
                case 'pior-desempenho': return result.sort(function(a, b) { return a.gpa - b.gpa; });
                default: return result;
            }
        }

                App.classes = turmas.map(t => ({

            const senha = document.getElementById('regSenha').value;
            const confirmSenha = document.getElementById('regConfirmSenha').value;
            const termos = document.getElementById('regTermos').checked;

            if (!nome || !sobrenome || !email || !senha) { App.errorMsg = 'Preencha todos os campos obrigatórios.'; render(); return; }

            if (senha !== confirmSenha) { App.errorMsg = 'As senhas não coincidem.'; render(); return; }
            if (!termos) { App.errorMsg = 'Aceite os termos para continuar.'; render(); return; }

            App.isLoading = true; App.errorMsg = ''; render();

            try {
                await apiRegister({ nome, sobrenome, email, senha });
                App.isLoading = false;
                App.mensagemToast = 'Conta criada com sucesso!';
                App.showSyncSuccess = true;

        function renderDashboard() {
            var items = [
                { id: 'salas', icon: 'fa-users', label: 'GESTÃO DE SALAS\n(TURMAS)' },
                { id: 'import', icon: 'fa-image', label: 'IMPORTAR IMAGEM\nDO GABARITO' },
                { id: 'scan', icon: 'fa-camera', label: 'DIGITALIZAR PROVA\n(ALUNO)' },
                { id: 'results', icon: 'fa-check-circle', label: 'CORRIGIR\nAUTOMATICAMENTE' },
                { id: 'compare', icon: 'fa-file-alt', label: 'COMPARAR COM O\nGABARITO OFICIAL' },
                { id: 'tips', icon: 'fa-lightbulb', label: 'SUGESTÕES DE MELHORIA' },
                { id: 'charts', icon: 'fa-chart-bar', label: 'GRÁFICOS DE\nDESEMPENHO' },
                { id: 'discursive', icon: 'fa-pen', label: 'CORREÇÃO DISCURSIVA\nCOM IA' }

            var notifHtml = '';

            if (App.showNotifications) {
                var listHtml = App.notifications.map(function(n) {
                    var cls = n.unread ? 'bg-[#e8f1f1] dark:bg-slate-600/50 font-semibold' : 'bg-gray-50 dark:bg-slate-600/10 text-gray-500';
                    return '<div class="p-2.5 rounded-xl text-xs ' + cls + '"><p class="leading-tight text-gray-800 dark:text-gray-200">' + n.text + '</p><span class="text-[10px] text-gray-400 block mt-1">' + n.time + '</span></div>';
                }).join('');
                notifHtml = '<div class="absolute right-0 mt-2 w-72 bg-white dark:bg-slate-700 rounded-2xl shadow-2xl border border-gray-100 dark:border-slate-600 z-50 p-4 animate-fade-in"><div class="flex justify-between items-center mb-3 pb-2 border-b dark:border-slate-600"><span class="text-xs font-black uppercase text-gray-500">Notificações</span><button onclick="markAllRead()" class="text-[10px] text-[#7aa2a1] font-bold">Marcar lidas</button></div><div class="space-y-3 max-h-60 overflow-y-auto">' + listHtml + '</div></div>';
            }

            var itemsHtml = items.map(function(item) {
                return '<button onclick="navigateTo(\'' + item.id + '\')" class="dashboard-item"><i class="fas ' + item.icon + '"></i><span>' + item.label + '</span></button>';
            }).join('');

            return '<div class="flex-1 flex flex-col bg-white dark:bg-slate-800">' +
                '<div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-slate-700">' +
                '<button onclick="App.sidebarOpen=true;render();" class="text-gray-600 dark:text-gray-300 p-2"><i class="fas fa-bars text-3xl"></i></button>' +
                '<div class="flex flex-col items-center">' + renderLogo('w-12 h-12') + renderLogoText() + '</div>' +
                '<div class="flex items-center gap-2">' +
                '<div class="relative cursor-pointer text-green-500 p-2"><i class="fas fa-cloud text-xl animate-bounce"></i><div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-white"></div></div>' +
                '<div class="relative"><button onclick="App.showNotifications=!App.showNotifications;render();" class="p-2 text-gray-600 dark:text-gray-300 relative hover:bg-gray-100 rounded-full"><i class="fas fa-bell text-2xl"></i>' + (unreadCount > 0 ? '<span class="notification-badge">' + unreadCount + '</span>' : '') + '</button>' + notifHtml + '</div>' +
                '</div></div>' +
                '<div class="flex-1 p-6 md:p-10 flex flex-col items-center justify-center max-w-4xl mx-auto w-full">' +
                '<h2 class="text-gray-400 dark:text-gray-500 font-bold text-xs tracking-widest uppercase mb-6 self-start flex items-center gap-2"><i class="fas fa-sparkles text-[#7aa2a1]"></i> Painel de ferramentas do docente</h2>' +
                '<div class="dashboard-grid">' + itemsHtml + '</div>' +
                '<div class="mt-6 text-center text-[10px] text-gray-400"><a href="' + CONFIG.GITHUB_URL + '" target="_blank" class="hover:text-[#7aa2a1]"><i class="fab fa-github"></i> GitHub</a></div>' +
                '</div></div>';
        }

        function markAllRead() {
            App.notifications.forEach(function(n) { n.unread = false; });
            App.showNotifications = false;
            render();
        }

        // ============================================================
        // RENDERIZAÇÃO - PERFIL
        // ============================================================
        function renderProfile() {
            var profileImg = App.profileImage ? '<img src="' + App.profileImage + '" class="w-full h-full object-cover" />' : '<i class="fas fa-user text-6xl text-gray-400"></i>';

            return '<div class="flex-1 flex flex-col p-6 md:p-10 bg-white dark:bg-slate-800 max-w-2xl mx-auto w-full">' +
                '<div class="flex items-center justify-between mb-8"><button onclick="navigateTo(\'dashboard\')" class="text-gray-400 hover:text-black p-2"><i class="fas fa-arrow-left text-2xl"></i></button><h2 class="text-xl font-bold text-gray-700 dark:text-slate-100">O Meu Perfil</h2><div class="w-10"></div></div>' +
                '<div class="flex flex-col items-center mb-8">' +
                '<div class="relative group cursor-pointer" onclick="document.getElementById(\'profileInput\').click()">' +
                '<div class="w-32 h-32 bg-gray-200 dark:bg-slate-700 rounded-full flex items-center justify-center overflow-hidden border-4 border-[#e8f1f1] dark:border-slate-700 shadow-md">' + profileImg + '</div>' +
                '<div class="absolute bottom-1 right-1 bg-[#7aa2a1] text-white p-2 rounded-full shadow border-2 border-white hover:bg-[#688f8e]"><i class="fas fa-camera text-sm"></i></div></div>' +
                '<p class="text-xs text-gray-400 dark:text-gray-500 mt-3 font-semibold">Clique para alterar a imagem</p>' +
                '<input type="file" id="profileInput" class="hidden" accept="image/*" onchange="handleProfileImage(event)" /></div>' +
                '<div class="space-y-4 max-w-md mx-auto w-full">' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1.5 block">Nome do Docente</label><input type="text" class="input-style" value="' + App.profileName + '" id="profileNameInput" /></div>' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1.5 block">Biografia / Escola</label><input type="text" class="input-style" value="' + App.profileBio + '" id="profileBioInput" /></div>' +
                '<div><label class="text-xs font-bold text-gray-500 mb-1.5 block">E-mail de Contacto</label><input type="email" class="input-style" value="' + App.profileEmail + '" id="profileEmailInput" /></div>' +
                '<div class="pt-6"><button onclick="handleUpdateProfile()" class="btn-solid">Guardar Alterações</button></div></div></div>';
        }

        async function handleUpdateProfile() {
            try {
                const nome = document.getElementById('profileNameInput').value;
                const biografia = document.getElementById('profileBioInput').value;
                const email = document.getElementById('profileEmailInput').value;

                await apiUpdateProfile({ nome, sobrenome: App.user?.sobrenome || '', email, biografia, escola: biografia, foto_perfil: App.profileImage });

                App.profileName = nome; App.profileBio = biografia; App.profileEmail = email;
                App.mensagemToast = 'Perfil atualizado!'; App.showSyncSuccess = true;
                render();
                setTimeout(function() { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) {
                App.mensagemErro = 'Erro ao atualizar: ' + error.message; App.showSyncError = true;
                render();
                setTimeout(function() { App.showSyncError = false; render(); }, 3000);
            }
        }

        function handleProfileImage(event) {
            var file = event.target.files[0];
            if (file) {
                processarArquivoImagem(file, function(result) { App.profileImage = result.dataUrl; render(); });
            }
        }

        // ============================================================
        // GESTÃO DE SALAS (ATUALIZADA)
        // ============================================================
        function renderSalas() {
            const filtro = App.salasFilter;
            let turmasFiltradas = [...App.classes];
            
            if (filtro.busca) turmasFiltradas = turmasFiltradas.filter(t => t.name.toLowerCase().includes(filtro.busca.toLowerCase()));
            if (filtro.status !== 'todos') turmasFiltradas = turmasFiltradas.filter(t => t.status === filtro.status);
            if (filtro.nivel !== 'todos') turmasFiltradas = turmasFiltradas.filter(t => t.nivel && t.nivel.toLowerCase().includes(filtro.nivel.toLowerCase()));
            
            switch (filtro.ordenar) {
                case 'nome': turmasFiltradas.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'media': turmasFiltradas.sort((a, b) => b.average - a.average); break;
                case 'alunos': turmasFiltradas.sort((a, b) => b.studentCount - a.studentCount); break;
                default: break;
            }
            
            const totalTurmas = App.classes.length;
            const totalAlunos = App.classes.reduce((acc, t) => acc + (t.studentCount || 0), 0);
            const mediaGeral = totalTurmas > 0 ? (App.classes.reduce((acc, t) => acc + (t.average || 0), 0) / totalTurmas).toFixed(1) : '0.0';
            const turmasAlerta = App.classes.filter(t => t.status === 'warning').length;
            const turmasCriticas = App.classes.filter(t => t.status === 'danger').length;
            
            const statsHtml = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-sm">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-[#e8f1f1] dark:bg-slate-600 flex items-center justify-center"><i class="fas fa-users text-[#7aa2a1]"></i></div><div><p class="text-[10px] text-gray-400 uppercase font-bold">Turmas</p><p class="text-xl font-black text-gray-800 dark:text-white">${totalTurmas}</p></div></div>
                    </div>
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-sm">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center"><i class="fas fa-user-graduate text-blue-500"></i></div><div><p class="text-[10px] text-gray-400 uppercase font-bold">Alunos</p><p class="text-xl font-black text-gray-800 dark:text-white">${totalAlunos}</p></div></div>
                    </div>
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-sm">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center"><i class="fas fa-chart-line text-green-500"></i></div><div><p class="text-[10px] text-gray-400 uppercase font-bold">Média Geral</p><p class="text-xl font-black text-gray-800 dark:text-white">${mediaGeral}</p></div></div>
                    </div>
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-sm">
                        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center"><i class="fas fa-exclamation-triangle text-yellow-500"></i></div><div><p class="text-[10px] text-gray-400 uppercase font-bold">Atenção</p><p class="text-xl font-black text-gray-800 dark:text-white">${turmasAlerta + turmasCriticas}</p></div></div>
                    </div>
                </div>
            `;
            
            const filtrosHtml = `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm mb-6">
                    <div class="flex flex-col md:flex-row gap-3">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" placeholder="Pesquisar turma..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-slate-700 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1] text-sm" value="${filtro.busca}" oninput="App.salasFilter.busca=this.value;render();" />
                        </div>
                        <select class="px-3 py-2.5 bg-gray-50 dark:bg-slate-700 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1] text-sm font-bold" onchange="App.salasFilter.status=this.value;render();">
                            <option value="todos" ${filtro.status === 'todos' ? 'selected' : ''}>Todos Status</option>
                            <option value="success" ${filtro.status === 'success' ? 'selected' : ''}>✅ Excelente</option>
                            <option value="warning" ${filtro.status === 'warning' ? 'selected' : ''}>⚠️ Atenção</option>
                            <option value="danger" ${filtro.status === 'danger' ? 'selected' : ''}>🔴 Crítico</option>
                        </select>
                        <select class="px-3 py-2.5 bg-gray-50 dark:bg-slate-700 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1] text-sm font-bold" onchange="App.salasFilter.nivel=this.value;render();">
                            <option value="todos" ${filtro.nivel === 'todos' ? 'selected' : ''}>Todos Níveis</option>
                            <option value="básico" ${filtro.nivel === 'básico' ? 'selected' : ''}>Ensino Básico</option>
                            <option value="secundário" ${filtro.nivel === 'secundário' ? 'selected' : ''}>Ensino Secundário</option>
                            <option value="profissional" ${filtro.nivel === 'profissional' ? 'selected' : ''}>Ensino Profissional</option>
                        </select>
                        <select class="px-3 py-2.5 bg-gray-50 dark:bg-slate-700 dark:text-white rounded-xl outline-none focus:ring-2 focus:ring-[#7aa2a1] text-sm font-bold" onchange="App.salasFilter.ordenar=this.value;render();">
                            <option value="recente" ${filtro.ordenar === 'recente' ? 'selected' : ''}>📅 Mais Recente</option>
                            <option value="nome" ${filtro.ordenar === 'nome' ? 'selected' : ''}>🔤 Nome (A-Z)</option>
                            <option value="media" ${filtro.ordenar === 'media' ? 'selected' : ''}>📊 Melhor Média</option>
                            <option value="alunos" ${filtro.ordenar === 'alunos' ? 'selected' : ''}>👥 Mais Alunos</option>
                        </select>
                        <button onclick="navigateTo('nova-turma')" class="px-4 py-2.5 bg-[#7aa2a1] text-white rounded-xl hover:bg-[#688f8e] transition-colors text-sm font-bold flex items-center gap-2 justify-center shadow-md"><i class="fas fa-plus"></i><span>Nova Turma</span></button>
                    </div>
                </div>
            `;
            
            let classesHtml = '';
            if (turmasFiltradas.length === 0) {
                classesHtml = `<div class="col-span-full empty-state"><i class="fas fa-users"></i><h3>${App.classes.length === 0 ? 'Nenhuma turma criada' : 'Nenhuma turma encontrada'}</h3><p>${App.classes.length === 0 ? 'Clique no botão "Nova Turma" para começar.' : 'Tente ajustar os filtros.'}</p></div>`;
            } else {
                classesHtml = turmasFiltradas.map(c => {
                    const statusLabel = getStatusLabelFromStatus(c.status);
                    const statusIcon = c.status === 'success' ? 'fa-check-circle' : c.status === 'warning' ? 'fa-exclamation-triangle' : 'fa-times-circle';
                    const percentualAprovacao = c.average >= 6 ? Math.floor(c.average * 10) : Math.floor(c.average * 8);
                    const mediaColor = c.average >= 8 ? 'text-green-500' : c.average >= 6 ? 'text-blue-500' : c.average >= 4 ? 'text-yellow-500' : 'text-red-500';
                    const initials = c.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                    
                    return `
                        <div class="bg-white dark:bg-slate-700 rounded-3xl shadow-sm border border-gray-100 dark:border-slate-600 overflow-hidden hover:shadow-xl transition-all duration-300 group">
                            <div class="h-2 ${getStatusColor(c.status)}"></div>
                            <div class="p-5">
                                <div class="flex items-start justify-between mb-4">
                                    <div class="flex items-center gap-3 flex-1 min-w-0">
                                        <div class="w-12 h-12 rounded-2xl ${c.status === 'success' ? 'bg-green-100 dark:bg-green-900/30' : c.status === 'warning' ? 'bg-yellow-100 dark:bg-yellow-900/30' : 'bg-red-100 dark:bg-red-900/30'} flex items-center justify-center shrink-0">
                                            <span class="text-lg font-black ${c.status === 'success' ? 'text-green-600 dark:text-green-400' : c.status === 'warning' ? 'text-yellow-600 dark:text-yellow-400' : 'text-red-600 dark:text-red-400'}">${initials}</span>
                                        </div>
                                        <div class="min-w-0 flex-1">
                                            <h4 class="text-base font-black text-gray-800 dark:text-white truncate">${c.name}</h4>
                                            <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full mt-1 ${c.status === 'success' ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : c.status === 'warning' ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'}"><i class="fas ${statusIcon}"></i> ${statusLabel}</span>
                                        </div>
                                    </div>
                                    <div class="relative">
                                        <button onclick="toggleMenuTurma('${c.id}', event)" class="p-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-600 rounded-lg transition-colors"><i class="fas fa-ellipsis-v"></i></button>
                                        <div id="menu-turma-${c.id}" class="hidden absolute right-0 top-10 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-gray-100 dark:border-slate-600 z-20 overflow-hidden">
                                            <button onclick="editarTurma('${c.id}')" class="w-full text-left px-4 py-2.5 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-slate-700 flex items-center gap-2"><i class="fas fa-edit text-[#7aa2a1]"></i> Editar</button>
                                            <button onclick="duplicarTurma('${c.id}')" class="w-full text-left px-4 py-2.5 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-slate-700 flex items-center gap-2"><i class="fas fa-copy text-blue-500"></i> Duplicar</button>
                                            <div class="border-t border-gray-100 dark:border-slate-700"></div>
                                            <button onclick="excluirTurma('${c.id}', '${c.name.replace(/'/g, "\\'")}')" class="w-full text-left px-4 py-2.5 text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center gap-2"><i class="fas fa-trash"></i> Excluir</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2 mb-4">
                                    <div class="bg-gray-50 dark:bg-slate-800 rounded-xl p-3 text-center"><p class="text-[9px] text-gray-400 uppercase font-bold mb-1">Alunos</p><p class="text-lg font-black text-gray-800 dark:text-white">${c.studentCount}</p></div>
                                    <div class="bg-gray-50 dark:bg-slate-800 rounded-xl p-3 text-center"><p class="text-[9px] text-gray-400 uppercase font-bold mb-1">Média</p><p class="text-lg font-black ${mediaColor}">${c.average}</p></div>
                                    <div class="bg-gray-50 dark:bg-slate-800 rounded-xl p-3 text-center"><p class="text-[9px] text-gray-400 uppercase font-bold mb-1">Nível</p><p class="text-[10px] font-black text-[#7aa2a1] leading-tight mt-1">${(c.nivel || 'Básico').split(' ').pop()}</p></div>
                                </div>
                                <div class="mb-4">
                                    <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold"><span>Aproveitamento</span><span>${percentualAprovacao}%</span></div>
                                    <div class="w-full bg-gray-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden"><div class="h-full ${c.status === 'success' ? 'bg-green-500' : c.status === 'warning' ? 'bg-yellow-500' : 'bg-red-500'} rounded-full transition-all duration-500" style="width: ${Math.min(percentualAprovacao, 100)}%"></div></div>
                                </div>
                                <div class="flex items-center gap-2 text-[10px] text-gray-400 mb-4"><i class="fas fa-clock"></i><span>Atualizado: ${c.lastActivity}</span></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="selectClass('${c.id}')" class="py-2.5 px-3 bg-[#e8f1f1] dark:bg-slate-600 text-[#7aa2a1] dark:text-slate-100 text-xs font-bold rounded-xl hover:bg-[#d0e1e1] transition-all flex items-center justify-center gap-2"><i class="fas fa-users"></i> Ver Alunos</button>
                                    <button onclick="selectClassAndNavigate('${c.id}','relatorios')" class="py-2.5 px-3 bg-gray-100 dark:bg-slate-600/50 text-gray-600 dark:text-slate-300 text-xs font-bold rounded-xl hover:bg-gray-200 transition-all flex items-center justify-center gap-2"><i class="fas fa-chart-bar"></i> Relatórios</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            return `
                <div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-5xl mx-auto w-full">
                    ${renderSimpleHeader('Gestão de Salas')}
                    <div class="p-6 md:p-8 flex-1 overflow-y-auto">
                        <div class="mb-6"><h2 class="text-2xl font-black text-gray-800 dark:text-white mb-1">Minhas Turmas</h2><p class="text-sm text-gray-500 dark:text-gray-400">Gerencie todas as suas turmas</p></div>
                        ${statsHtml}
                        ${filtrosHtml}

        function toggleMenuTurma(turmaId, event) {
            event.stopPropagation();
            document.querySelectorAll('[id^="menu-turma-"]').forEach(menu => {
                if (menu.id !== `menu-turma-${turmaId}`) menu.classList.add('hidden');
            });
            const menu = document.getElementById(`menu-turma-${turmaId}`);
            if (menu) menu.classList.toggle('hidden');
            setTimeout(() => {
                document.addEventListener('click', function fecharMenu(e) {
                    if (!e.target.closest(`#menu-turma-${turmaId}`)) {
                        const m = document.getElementById(`menu-turma-${turmaId}`);
                        if (m) m.classList.add('hidden');
                        document.removeEventListener('click', fecharMenu);
                    }
                });
            }, 100);
        }

        async function editarTurma(turmaId) {
            try {
                const result = await apiBuscarTurma(turmaId);
                const turma = result.turma;
                const novoNome = prompt('Nome da turma:', turma.nome);
                if (novoNome === null) return;
                const novoNivel = prompt('Nível:', turma.nivel);
                if (novoNivel === null) return;
                const novoStatus = prompt('Status (success/warning/danger):', turma.status);
                if (novoStatus === null) return;

                await apiAtualizarTurma(turmaId, { nome: novoNome.trim(), nivel: novoNivel.trim(), status: novoStatus.trim(), total_aulas: turma.total_aulas });
                await carregarTurmas();
                App.mensagemToast = 'Turma atualizada!'; App.showSyncSuccess = true; render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) { alert('Erro ao editar: ' + error.message); }
        }

        async function duplicarTurma(turmaId) {
            if (!confirm('Deseja duplicar esta turma?')) return;
            try {
                await apiDuplicarTurma(turmaId);
                await carregarTurmas();
                App.mensagemToast = 'Turma duplicada!'; App.showSyncSuccess = true; render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);
            } catch (error) { alert('Erro ao duplicar: ' + error.message); }
        }

        async function excluirTurma(turmaId, turmaNome) {
            if (!confirm(`⚠️ Excluir a turma "${turmaNome}"?\nTodos os dados serão apagados.`)) return;
            try {
                await apiDeletarTurma(turmaId);
                await carregarTurmas();
                App.mensagemToast = 'Turma excluída!'; App.showSyncSuccess = true; render();
                setTimeout(() => { App.showSyncSuccess = false; render(); }, 3000);

        }

            App.modalNota.data = new Date().toISOString().split('T')[0];
            App.mostrarModalNota = true;
            render();

        function cancelarNota() {
            App.mostrarModalNota = false;
            render();
        }

        async function confirmarNota() {
            var cls = App.selectedClass;
            if (!cls) return;
            var alunoId = App.modalNota.alunoId;
            var titulo = App.modalNota.titulo.trim();
            var nota = App.modalNota.nota;
            var data = App.modalNota.data;

            if (!titulo) { alert('Insira um título.'); return; }
            if (nota <= 0 || nota > 10) { alert('Nota inválida (0-10).'); return; }

            try {
                await apiAdicionarNota(alunoId, { titulo, nota, data, acertos: Math.round(nota * 2), erros: Math.round((10 - nota) * 2), questoes_detalhes: getRandomDetails(20) });

                App.mensagemToast = 'Nota adicionada!'; App.showSyncSuccess = true; render();

                        App.selectedStudent = cls.students[i];
                        navigateTo('aluno-detalhe');

                </div>

            render();

                for (var i = 0; i < App.novaTurma.alunos.length; i++) {
                    await apiAdicionarAluno({ turma_id: turma.id, numero: App.novaTurma.alunos[i].number, nome: App.novaTurma.alunos[i].name, gpa: App.novaTurma.alunos[i].gpa || 0 });

                App.novaTurma = { nome: '', nivel: 'Ensino Básico', status: 'success', totalAulas: 0, alunos: [] };

            const hasOfficial = App.officialGabarito !== null;
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">
                ${renderSimpleHeader('Importar Gabarito')}
                <div class="flex-1 p-6 flex flex-col items-center justify-center gap-6">
                    <div class="drop-zone w-full max-w-md ${hasOfficial ? 'border-green-500' : ''}" onclick="${!hasOfficial ? "document.getElementById('importInput').click()" : ''}" ondragover="event.preventDefault(); this.classList.add('dragover')" ondragleave="event.preventDefault(); this.classList.remove('dragover')" ondrop="handleDropImport(event)">
                        ${hasOfficial ? `<div class="text-center text-green-600"><i class="fas fa-check-circle text-6xl mb-2"></i><p class="font-black uppercase">Gabarito Registado</p><div class="mt-4 max-w-xs mx-auto"><img src="${App.officialGabarito.dataUrl}" class="rounded-lg border shadow-sm max-h-48 object-contain w-full" /></div><button onclick="event.stopPropagation();App.officialGabarito=null;render();" class="mt-4 text-xs bg-red-500 text-white px-4 py-2 rounded-lg"><i class="fas fa-trash"></i> Remover</button></div>` : `<i class="fas fa-cloud-upload-alt text-6xl text-[#7aa2a1] mb-4"></i><p class="font-bold text-[#7aa2a1] uppercase tracking-widest text-sm">Importar Gabarito</p><p class="text-gray-400 text-xs mt-2 text-center">Arraste ou clique</p>`}
                    </div>
                    <input type="file" id="importInput" class="hidden" accept="image/*,.pdf" onchange="handleImportUpload(event)" />
                    ${!hasOfficial ? `<div class="flex gap-4 w-full max-w-md"><button onclick="document.getElementById('importInput').click()" class="flex-1 py-3 bg-[#e8f1f1] text-[#7aa2a1] font-bold rounded-xl text-sm flex items-center justify-center gap-2"><i class="fas fa-folder-open"></i> Carregar</button><button onclick="tirarFoto(function(result) { App.officialGabarito = result; render(); })" class="flex-1 py-3 bg-[#7aa2a1] text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2"><i class="fas fa-camera"></i> Tirar Foto</button></div>` : ''}
                </div>
            </div>`;
        }

        function handleDropImport(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file) processarArquivoImagem(file, function(result) { App.officialGabarito = result; render(); });
        }

        function handleImportUpload(event) {
            const file = event.target.files[0];
            if (file) processarArquivoImagem(file, function(result) { App.officialGabarito = result; render(); });
        }

        function renderScan() {
            const hasImage = App.studentGabarito !== null;
            return `<div class="flex-1 flex flex-col bg-[#0a0a0a] text-white w-full max-w-4xl mx-auto">
                <div class="p-6 flex justify-between items-center bg-black/40"><button onclick="stopScan();navigateTo('dashboard');" class="text-white p-2"><i class="fas fa-arrow-left text-2xl"></i></button><h2 class="text-sm font-bold uppercase">Digitalizar Prova</h2><div class="w-10"></div></div>
                <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
                    ${hasImage ? `<div class="relative w-full max-w-sm rounded-3xl overflow-hidden border-4 border-green-500 mb-4"><img src="${App.studentGabarito.dataUrl}" class="w-full aspect-[3/4] object-contain bg-black" /><button onclick="App.studentGabarito=null;render();" class="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full"><i class="fas fa-times"></i></button></div><div class="flex gap-4"><button onclick="navigateTo('confirm')" class="bg-green-500 text-white font-bold py-3 px-8 rounded-xl">Usar Imagem</button><button onclick="App.studentGabarito=null;render();" class="bg-gray-600 text-white font-bold py-3 px-6 rounded-xl">Nova</button></div>` : `<div class="relative w-full max-w-sm aspect-[3/4] rounded-3xl overflow-hidden bg-black flex items-center justify-center border-4 border-[#7aa2a1]"><video id="scanVideo" autoplay playsinline class="w-full h-full object-cover"></video><div class="scan-line"></div><div class="scan-overlay"></div></div><canvas id="scanCanvas" class="hidden"></canvas><div class="mt-8 flex flex-col items-center gap-4 w-full max-w-sm"><button onclick="captureScan()" class="w-full py-4 bg-[#7aa2a1] text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2"><i class="fas fa-camera"></i> Tirar Foto</button><button onclick="document.getElementById('scanFallback').click()" class="w-full py-3.5 bg-gray-800 border border-gray-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2"><i class="fas fa-folder-open"></i> Carregar Arquivo</button><input type="file" id="scanFallback" class="hidden" accept="image/*,.pdf" onchange="handleScanFallback(event)" /></div>`}
                </div>
            </div>`;
        }

        function initScan() { const video = document.getElementById('scanVideo'); if (video) startScan(); }

        function startScan() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) { App.scanStream = stream; const video = document.getElementById('scanVideo'); if (video) video.srcObject = stream; }).catch(function(err) { console.warn('Câmara indisponível:', err); });
            }
        }

        function stopScan() { if (App.scanStream) { App.scanStream.getTracks().forEach(t => t.stop()); App.scanStream = null; } }

        function captureScan() {
            const video = document.getElementById('scanVideo');
            const canvas = document.getElementById('scanCanvas');
            if (video && canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg');
                stopScan();
                App.studentGabarito = { dataUrl: dataUrl, mimeType: 'image/jpeg', base64: dataUrl.split(',')[1] };
                render();
            }
        }

        function handleScanFallback(event) {
            const file = event.target.files[0];
            if (file) processarArquivoImagem(file, function(result) { App.studentGabarito = result; render(); });
        }

        function renderConfirm() {
            const image = App.studentGabarito;
            return `<div class="flex-1 flex flex-col bg-black/95 relative max-w-3xl mx-auto w-full"><div class="p-6 flex justify-between z-10"><button onclick="navigateTo('scan')" class="text-white p-2"><i class="fas fa-arrow-left text-2xl"></i></button><span class="text-white/60 font-bold text-sm uppercase">Confirmar</span><div class="w-10"></div></div>
                <div class="flex-1 flex flex-col items-center justify-center z-10 p-6"><div class="bg-white p-4 rounded-2xl shadow-2xl mb-8 max-w-sm w-full overflow-hidden">${image && image.dataUrl ? `<img src="${image.dataUrl}" class="w-full aspect-[3/4] object-contain rounded-lg" />` : `<div class="border border-gray-300 rounded-lg p-4 bg-white text-center text-gray-400">Nenhuma imagem</div>`}</div><div class="flex gap-4"><button onclick="handleConfirm()" class="bg-[#7aa2a1] text-white font-bold py-4 px-12 rounded-xl shadow-lg">CONFIRMAR</button><button onclick="navigateTo('scan')" class="bg-gray-600 text-white font-bold py-4 px-6 rounded-xl">Refazer</button></div></div>
            </div>`;
        }

        function handleConfirm() { navigateTo('results'); }

        function renderResults() {
            const hasOfficial = App.officialGabarito !== null;
            const hasStudent = App.studentGabarito !== null;
            let classOptions = ''; for (let ci = 0; ci < App.classes.length; ci++) classOptions += `<option value="${App.classes[ci].id}">${App.classes[ci].name}</option>`;
            let targetClass = null; for (let i = 0; i < App.classes.length; i++) if (App.classes[i].id === App.selectedTargetClass) targetClass = App.classes[i];
            if (!targetClass) targetClass = { students: [] };
            let studentOptions = ''; for (let si = 0; si < targetClass.students.length; si++) studentOptions += `<option value="${targetClass.students[si].id}">${targetClass.students[si].name} (Nº ${targetClass.students[si].number})</option>`;

            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Correção Automática')}
                <div class="flex-1 p-6 flex flex-col justify-center items-center">
                    <div class="w-full max-w-md bg-gray-50 dark:bg-slate-700 border rounded-3xl p-6 mb-6"><h3 class="font-bold text-gray-700 dark:text-slate-200 text-sm mb-4 uppercase flex items-center gap-2"><i class="fas fa-sync-alt text-[#7aa2a1]"></i> Configuração</h3>
                        <div class="space-y-4"><div><label class="text-xs font-bold text-gray-500 mb-1 block">Turma:</label><select class="w-full py-2.5 px-3 rounded-xl border dark:border-slate-600 bg-white dark:bg-slate-800 text-sm outline-none" onchange="App.selectedTargetClass=this.value;render();">${classOptions}</select></div><div><label class="text-xs font-bold text-gray-500 mb-1 block">Aluno:</label><select class="w-full py-2.5 px-3 rounded-xl border dark:border-slate-600 bg-white dark:bg-slate-800 text-sm outline-none" onchange="App.selectedTargetStudent=this.value">${studentOptions}</select></div></div>
                    </div>
                    <div class="w-full max-w-md bg-gray-50 dark:bg-slate-700 border rounded-2xl p-6 mb-6"><h3 class="font-bold text-gray-700 dark:text-slate-200 text-xs mb-4 uppercase tracking-wider">Estado das Imagens</h3>
                        <div class="flex items-center justify-between mb-4 pb-3 border-b dark:border-slate-600"><span class="text-xs font-bold text-gray-500 uppercase">1. Gabarito Oficial</span>${hasOfficial ? `<span class="text-xs bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full"><i class="fas fa-check"></i> PRONTO</span>` : `<button onclick="navigateTo('import')" class="text-xs bg-red-50 text-red-600 font-bold px-3 py-1 rounded-full">CARREGAR</button>`}</div>
                        <div class="flex items-center justify-between"><span class="text-xs font-bold text-gray-500 uppercase">2. Prova do Aluno</span>${hasStudent ? `<span class="text-xs bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full"><i class="fas fa-check"></i> PRONTO</span>` : `<button onclick="navigateTo('scan')" class="text-xs bg-gray-100 text-gray-700 font-bold px-3 py-1 rounded-lg">DIGITALIZAR</button>`}</div>
                    </div>
                    <div class="w-full max-w-md"><button onclick="handleAiCorrection()" ${(App.isLoading || !hasOfficial || !hasStudent) ? 'disabled' : ''} class="w-full py-4 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2 transition-all ${(App.isLoading || !hasOfficial || !hasStudent) ? 'bg-gray-300 cursor-not-allowed text-gray-500' : 'bg-[#7aa2a1] hover:bg-[#688f8e] active:scale-95'}">${App.isLoading ? '<i class="fas fa-sync-alt animate-spin"></i> A CORRIGIR...' : '<i class="fas fa-check-circle"></i> INICIAR CORREÇÃO'}</button></div>
                </div>
            </div>`;
        }

        function handleAiCorrection() {
            if (!App.officialGabarito || !App.studentGabarito) { alert('Carregue o gabarito e a prova.'); return; }
            App.isLoading = true; render();
            setTimeout(function() {
                const grade = (Math.random() * 4 + 6);
                App.lastCorrectionData = { studentName: "Aluno", grade: grade.toFixed(1), mainDifficulty: 'Interpretação', tipsList: [{ title: "Revisão", desc: "Praticar mais." }] };
                App.isLoading = false; App.mensagemToast = 'Correção realizada!'; App.showSyncSuccess = true; render();
                setTimeout(function() { App.showSyncSuccess = false; navigateTo('tips'); }, 2000);
            }, 1500);
        }

        function renderCompare() {
            const hasOfficial = App.officialGabarito !== null; const hasStudent = App.studentGabarito !== null;
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-4xl mx-auto w-full">${renderSimpleHeader('Comparação')}
                <div class="flex-1 p-6"><div class="grid md:grid-cols-2 gap-6 h-full">
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-200 flex flex-col"><h3 class="font-bold text-xs mb-3 uppercase text-[#7aa2a1] text-center border-b pb-2">GABARITO DO PROFESSOR</h3><div class="flex-1 flex items-center justify-center min-h-[200px]">${hasOfficial ? `<img src="${App.officialGabarito.dataUrl}" class="max-h-[400px] max-w-full object-contain rounded-lg shadow-sm" />` : `<div class="text-gray-400 text-sm">Não carregado</div>`}</div></div>
                    <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl border border-gray-200 flex flex-col"><h3 class="font-bold text-xs mb-3 uppercase text-[#7aa2a1] text-center border-b pb-2">PROVA DO ALUNO</h3><div class="flex-1 flex items-center justify-center min-h-[200px]">${hasStudent ? `<img src="${App.studentGabarito.dataUrl}" class="max-h-[400px] max-w-full object-contain rounded-lg shadow-sm" />` : `<div class="text-gray-400 text-sm">Não carregada</div>`}</div></div>
                </div></div>
            </div>`;
        }

        function renderTips() {
            const data = App.lastCorrectionData || { studentName: 'Aluno', mainDifficulty: 'Nenhuma', tipsList: [] };
            let tipsHtml = data.tipsList.map(t => `<div class="bg-gray-50 dark:bg-slate-700/50 p-4 rounded-xl border border-gray-100 dark:border-slate-600"><h4 class="font-bold text-gray-800 dark:text-white mb-1">${t.title}</h4><p class="text-gray-600 dark:text-slate-400">${t.desc}</p></div>`).join('');
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Sugestões')}
                <div class="p-6 overflow-y-auto"><div class="bg-yellow-50/50 dark:bg-slate-900 border border-yellow-200 rounded-2xl p-6 mb-8 text-center"><h2 class="text-sm font-bold text-yellow-800 uppercase">Dificuldade em <strong>${data.mainDifficulty}</strong></h2></div><h3 class="text-gray-400 font-bold text-xs uppercase mb-4">Recomendações</h3><div class="space-y-6">${tipsHtml}</div></div>
            </div>`;
        }

        function renderCharts() {
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Gráficos')}<div class="flex-1 p-6 flex items-center justify-center"><div class="text-center text-gray-400"><i class="fas fa-chart-bar text-6xl mb-4"></i><p>Em desenvolvimento</p></div></div></div>`;
        }

        function renderDiscursive() {
            const hasOfficial = App.localOfficial !== null; const hasStudent = App.studentAnswer !== null;
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Correção Discursiva')}
                <div class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-slate-700 p-6 rounded-3xl border border-gray-100 flex flex-col relative"><div class="absolute top-0 left-0 w-2 h-full bg-[#7aa2a1]"></div><h3 class="font-bold text-gray-800 dark:text-white text-sm mb-3 pl-2">1. Gabarito</h3><div class="flex-1 min-h-[180px]">${hasOfficial ? `<img src="${App.localOfficial.dataUrl}" class="w-full max-h-48 object-contain rounded-xl" /><button onclick="App.localOfficial=null;render();" class="text-red-500 text-xs mt-2">Remover</button>` : `<div class="drop-zone h-full flex flex-col items-center justify-center" onclick="document.getElementById('discursiveOfficial').click()"><i class="fas fa-cloud-upload-alt text-4xl text-[#7aa2a1] mb-3"></i><p class="text-sm font-bold text-[#7aa2a1]">Carregar</p><input type="file" id="discursiveOfficial" class="hidden" accept="image/*" onchange="handleDiscursiveOfficial(event)" /></div>`}</div></div>
                        <div class="bg-white dark:bg-slate-700 p-6 rounded-3xl border border-gray-100 flex flex-col relative"><div class="absolute top-0 left-0 w-2 h-full bg-[#7aa2a1]"></div><h3 class="font-bold text-gray-800 dark:text-white text-sm mb-3 pl-2">2. Resposta</h3><div class="flex-1 min-h-[180px]">${hasStudent ? `<img src="${App.studentAnswer.dataUrl}" class="w-full max-h-48 object-contain rounded-xl" /><button onclick="App.studentAnswer=null;render();" class="text-red-500 text-xs mt-2">Remover</button>` : `<div class="drop-zone h-full flex flex-col items-center justify-center" onclick="document.getElementById('discursiveStudent').click()"><i class="fas fa-cloud-upload-alt text-4xl text-[#7aa2a1] mb-3"></i><p class="text-sm font-bold text-[#7aa2a1]">Carregar</p><input type="file" id="discursiveStudent" class="hidden" accept="image/*" onchange="handleDiscursiveStudent(event)" /></div>`}</div></div>
                    </div>
                    <div class="flex justify-center"><button onclick="handleDiscursiveAnalyze()" ${(!hasOfficial || !hasStudent) ? 'disabled' : ''} class="w-full max-w-md py-4 rounded-xl font-bold text-white ${(!hasOfficial || !hasStudent) ? 'bg-gray-400' : 'bg-[#7aa2a1]'}">Realizar Correção por IA</button></div>
                </div>
            </div>`;
        }

        function handleDiscursiveOfficial(event) { const file = event.target.files[0]; if (file) processarArquivoImagem(file, r => { App.localOfficial = r; render(); }); }
        function handleDiscursiveStudent(event) { const file = event.target.files[0]; if (file) processarArquivoImagem(file, r => { App.studentAnswer = r; render(); }); }
        function handleDiscursiveAnalyze() { App.aiResult = 'Avaliação em processamento...'; navigateTo('ai_result'); }

        function renderAiResult() {
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Resultado IA')}<div class="flex-1 p-6"><div class="bg-[#e8f1f1] dark:bg-slate-700/50 p-6 rounded-2xl border"><p class="text-sm">${App.aiResult || 'Nenhum resultado'}</p></div><button onclick="navigateTo('dashboard')" class="mt-8 w-full btn-solid">Voltar</button></div></div>`;
        }

        function renderAplicarProva() {
            return `<div class="flex-1 flex flex-col bg-white dark:bg-slate-800 max-w-3xl mx-auto w-full">${renderSimpleHeader('Aplicar Prova')}<div class="flex-1 p-6 flex items-center justify-center"><div class="text-center text-gray-400"><i class="fas fa-qrcode text-6xl mb-4"></i><p>Em desenvolvimento</p></div></div></div>`;
        }

        // ============================================================
        // INICIAR APLICAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AUTOMATIC CORRECTION - Inicializando...');
            setTimeout(verificarServidor, 1000);

            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            if (token && user) {
                try {
                    App.user = JSON.parse(user);
                    App.profileName = App.user.nome || 'Professor';
                    App.profileEmail = App.user.email || '';
                    App.profileBio = App.user.biografia || 'Docente';
                    
                    carregarTurmas().then(() => { navigateTo('dashboard'); });
                } catch (e) {
                    localStorage.removeItem('token'); localStorage.removeItem('user'); navigateTo('login');
                }
            } else {
                navigateTo('splash');
            }
        });
    </script>
</body>
</html>
